<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#00e5a0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HIVE">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/1hive_orig.png">
<title>HIVE — Command Interface</title>
<style>
:root{--bg:#07080c;--panel:#0f1118;--panel2:#161a24;--border:#2a3142;--accent:#00e5a0;--accent2:#00b4d8;--danger:#ff3b5c;--warn:#ffb020;--ok:#00e5a0;--text:#e8edf5;--muted:#8b95a8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;user-select:none}
.screen{display:none;min-height:100vh}.screen.active{display:flex;flex-direction:column}
#titleScreen{align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#0a1a18 0%,#07080c 70%);padding:28px 16px;text-align:center}
.logo-img{max-width:240px;width:100%;margin-bottom:8px;filter:drop-shadow(0 0 16px rgba(0,229,160,.35))}
.tagline{color:var(--muted);letter-spacing:3px;font-size:.78rem;margin-bottom:18px}
.leader-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;max-width:900px;width:100%;margin-bottom:18px}
.leader-card{background:var(--panel);border:2px solid var(--border);border-radius:11px;padding:9px;cursor:pointer;transition:all .25s}
.leader-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 8px 22px rgba(0,229,160,.2)}
.leader-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,160,.35)}
.leader-card img{width:100%;height:160px;object-fit:contain;border-radius:8px;background:#0a0c12;margin-bottom:6px}
.leader-card h3{font-size:.85rem}.leader-card .rank{font-size:.65rem;color:var(--accent)}
.start-btn{background:linear-gradient(135deg,#00e5a0,#00b4d8);color:#04120e;border:none;padding:12px 36px;font-size:.95rem;font-weight:800;border-radius:9px;cursor:pointer}
.start-btn:disabled{opacity:.35;cursor:not-allowed}
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:7px 12px;display:flex;align-items:center;gap:14px}
.logo-small{height:26px}.res{display:flex;gap:8px}
.res-item{background:var(--panel2);padding:3px 8px;border-radius:5px;font-size:.75rem;font-weight:600}
.res-item span{color:var(--accent)}
.commander-info{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:.8rem}
.sanity-bar{width:85px;height:6px;background:#1a2030;border-radius:3px;overflow:hidden}
.sanity-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.main{flex:1;display:grid;grid-template-columns:240px 1fr 260px;overflow:hidden}
.panel{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel:last-child{border-right:none;border-left:1px solid var(--border)}
.panel-b{flex:1;overflow-y:auto;padding:9px}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;text-align:center;padding:7px 2px;font-size:.65rem;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.sector-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sector{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;min-height:58px;transition:all .2s}
.sector:hover{border-color:var(--accent)}.sector.locked{opacity:.4;cursor:not-allowed}
.sector.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.sector.hot{border-color:var(--danger)}
.sector-name{font-weight:700;font-size:.75rem}.sector-status{font-size:.6rem;color:var(--muted);margin-top:2px}
.sector-deployed{font-size:.58rem;color:var(--accent);margin-top:2px}
.unit-card{background:var(--panel2);border:2px solid var(--border);border-radius:8px;padding:6px;margin-bottom:6px;cursor:pointer;display:flex;gap:6px;align-items:center;transition:all .2s}
.unit-card:hover{border-color:var(--accent);transform:scale(1.02)}
.unit-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,229,160,.3)}
.unit-card.acted{opacity:.5;filter:grayscale(.4)}
.unit-card img{width:56px;height:56px;object-fit:contain;border-radius:6px;background:#0a0c12}
.unit-name{font-weight:700;font-size:.75rem}.unit-role{font-size:.6rem;color:var(--muted)}
.bar{height:4px;background:#1a2030;border-radius:2px;overflow:hidden;margin-top:2px}
.bar-fill{height:100%;border-radius:2px;transition:width .35s}
.hp-fill{background:linear-gradient(90deg,#00e5a0,#34d399)}.san-fill{background:linear-gradient(90deg,#00b4d8,#67e8f9)}
.center{display:flex;flex-direction:column;background:#0a0c12;overflow:hidden}
.mission-h{padding:8px 11px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.battlefield{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:9px;overflow-y:auto}
.side-title{font-size:.65rem;text-transform:uppercase;color:var(--muted);margin-bottom:4px;letter-spacing:1px}
.combat-card{background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:7px;margin-bottom:6px;cursor:pointer;display:flex;gap:6px;align-items:center}
.combat-card:hover{border-color:var(--accent)}.combat-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,229,160,.3)}
.combat-card.enemy{border-color:#5c1a1a;background:#140c0e}.combat-card.enemy:hover{border-color:var(--danger)}
.combat-card.dead{opacity:.3;filter:grayscale(.8);pointer-events:none}.combat-card.acted{opacity:.5}
.combat-card img{width:52px;height:52px;object-fit:contain;border-radius:5px;background:#0a0c12}
.action-bar{padding:8px 11px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;background:var(--panel)}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 11px;border-radius:6px;font-weight:600;font-size:.75rem;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,#00e5a0,#00b4d8);border:none;color:#04120e}
.btn.danger{background:linear-gradient(135deg,#ff3b5c,#c0102e);border:none;color:#fff}
.radar-box{background:#0a1210;border:1px solid var(--border);border-radius:8px;padding:9px;margin-bottom:7px;text-align:center}
.radar-circle{width:110px;height:110px;margin:0 auto 5px;border-radius:50%;border:2px solid rgba(0,229,160,.3);position:relative;background:radial-gradient(circle,#0a1a14 0%,#050808 70%)}
.radar-sweep{position:absolute;top:50%;left:50%;width:50%;height:2px;background:linear-gradient(90deg,transparent,var(--accent));transform-origin:left center;animation:sweep 3s linear infinite}
@keyframes sweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.radar-blip{position:absolute;width:6px;height:6px;background:var(--danger);border-radius:50%;box-shadow:0 0 5px var(--danger)}
.veh-card{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:6px;margin-bottom:5px;display:flex;gap:6px;align-items:center;cursor:pointer}
.veh-card:hover{border-color:var(--accent)}.veh-card img{width:64px;height:44px;object-fit:contain}.veh-card.deployed{border-color:var(--ok)}
.tx-item{background:var(--panel2);border-left:3px solid var(--accent2);padding:6px 8px;margin-bottom:4px;border-radius:0 5px 5px 0;font-size:.7rem}
.tx-item.danger{border-left-color:var(--danger)}.tx-item.warn{border-left-color:var(--warn)}.tx-time{font-size:.58rem;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:600;padding:12px}
.overlay.active{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:11px;max-width:500px;width:100%;padding:18px;max-height:90vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:10px;right:12px;width:32px;height:32px;border:none;background:var(--panel2);color:var(--muted);font-size:1.3rem;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;z-index:5}
.modal-close:hover{background:var(--danger);color:#fff}
.modal h2{font-size:1.1rem;margin-bottom:3px}.modal-sub{color:var(--muted);font-size:.8rem;margin-bottom:10px;line-height:1.45}
.atk-stage{text-align:center;margin:10px 0}
.atk-portraits{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:8px}
.atk-portraits img{width:76px;height:76px;object-fit:contain;border-radius:7px;background:#0a0c12;transition:all .3s}
.atk-portraits img.shake{animation:shake .4s ease}.atk-portraits img.hit{animation:hitFlash .5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes hitFlash{0%{filter:brightness(1)}30%{filter:brightness(2.2) drop-shadow(0 0 14px #ff3b5c)}100%{filter:brightness(1)}}
.atk-vs{font-size:1.4rem;font-weight:900;color:var(--danger);text-shadow:0 0 12px rgba(255,59,92,.6)}
.atk-bar{height:11px;background:#1a2030;border-radius:5px;overflow:hidden;margin:10px 0;border:1px solid var(--border)}
.atk-fill{height:100%;width:0%;background:linear-gradient(90deg,#00e5a0,#00b4d8,#ff3b5c);transition:width 0.9s linear;box-shadow:0 0 8px rgba(0,229,160,.5)}
.atk-log{font-size:.88rem;min-height:44px;color:var(--text);font-weight:600}
.atk-dmg{font-size:1.5rem;font-weight:900;color:var(--danger);text-shadow:0 0 10px rgba(255,59,92,.5);opacity:0;transition:opacity .3s}
.atk-dmg.show{opacity:1}
.store-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:6px;display:flex;gap:8px;align-items:center;cursor:pointer;transition:all .2s}
.store-item:hover{border-color:var(--accent);transform:scale(1.02)}
.store-item img{width:72px;height:52px;object-fit:contain;background:#0a0c12;border-radius:5px}
.store-info{flex:1}.store-info strong{display:block;font-size:.8rem}.store-info small{color:var(--muted);font-size:.65rem}
.store-cost{color:var(--accent);font-weight:700;font-size:.8rem}
.bio-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0;text-align:left}
.bio-item{background:var(--panel2);padding:7px;border-radius:5px;font-size:.72rem}
.bio-item .label{color:var(--muted);font-size:.6rem}
.bio-story{text-align:left;font-size:.78rem;line-height:1.5;color:var(--muted);margin:8px 0;max-height:150px;overflow-y:auto}
.toast-c{position:fixed;bottom:12px;right:12px;display:flex;flex-direction:column;gap:4px;z-index:1000;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);padding:8px 11px;border-radius:5px;font-size:.75rem;max-width:270px;animation:slideIn .3s ease}
.toast.danger{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warn)}
@keyframes slideIn{from{transform:translateX(26px);opacity:0}to{transform:translateX(0);opacity:1}}
.empty{text-align:center;color:var(--muted);padding:16px 5px;font-size:.75rem}

.build-progress { height: 8px; background: #1a2030; border-radius: 4px; overflow: hidden; margin-top: 4px; border: 1px solid var(--border); }
.build-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.5s linear; width: 0%; }
.modal.wide { max-width: 560px; }
.modal.wide img.building-hero { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
.building-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.building-stat { background: var(--panel2); padding: 10px; border-radius: 6px; font-size: 0.78rem; }
.building-stat .label { color: var(--muted); font-size: 0.65rem; margin-bottom: 2px; }


/* Pokémon-style battle */
.poke-battle { text-align: center; }
.poke-field { display: flex; justify-content: space-between; align-items: flex-end; min-height: 180px; margin: 12px 0; position: relative; }
.poke-enemy { text-align: right; flex: 1; }
.poke-player { text-align: left; flex: 1; }
.poke-sprite { width: 100px; height: 100px; object-fit: contain; background: #0a0c12; border-radius: 8px; transition: all 0.3s; }
.poke-sprite.hurt { animation: pokeHurt 0.5s ease; }
.poke-sprite.attack { animation: pokeAttack 0.4s ease; }
.poke-sprite.faint { animation: pokeFaint 0.8s ease forwards; }
@keyframes pokeHurt { 0%,100%{transform:translateX(0);filter:brightness(1)} 20%,60%{transform:translateX(-8px);filter:brightness(2) drop-shadow(0 0 8px #ff3b5c)} 40%{transform:translateX(8px)} }
@keyframes pokeAttack { 0%{transform:translateX(0)} 40%{transform:translateX(20px)} 100%{transform:translateX(0)} }
@keyframes pokeFaint { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(30px)} }
.poke-hp-box { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin: 4px 0; display: inline-block; min-width: 140px; text-align: left; }
.poke-hp-box .name { font-weight: 700; font-size: 0.8rem; }
.poke-hp-bar { height: 8px; background: #1a2030; border-radius: 4px; overflow: hidden; margin-top: 3px; }
.poke-hp-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.poke-moves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
.poke-move { background: var(--panel2); border: 2px solid var(--border); border-radius: 8px; padding: 10px; cursor: pointer; text-align: left; font-size: 0.8rem; font-weight: 600; }
.poke-move:hover { border-color: var(--accent); background: #1a2030; }
.poke-move .pp { font-size: 0.65rem; color: var(--muted); }
.poke-log { font-size: 0.85rem; min-height: 36px; margin: 8px 0; color: var(--text); font-weight: 600; }


/* ===== PHONE / MOBILE ===== */
@media (max-width: 900px) {
  .main {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }
  .panel {
    max-height: none;
    border-right: none !important;
    border-left: none !important;
    border-bottom: 1px solid var(--border);
  }
  .panel:last-child { border-bottom: none; }
  .battlefield { grid-template-columns: 1fr; gap: 8px; }
  .leader-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .leader-card img { height: 90px; }
  .topbar { flex-wrap: wrap; gap: 8px; padding: 8px 10px; }
  .commander-info { margin-left: 0; width: 100%; justify-content: space-between; }
  .action-bar { position: sticky; bottom: 0; z-index: 50; padding: 10px; gap: 8px; }
  .btn { padding: 12px 14px; font-size: 0.85rem; min-height: 44px; }
  .btn.primary, .btn.danger { flex: 1; }
  .unit-card, .combat-card, .store-item, .veh-card { min-height: 52px; }
  .modal { max-width: 100%; margin: 8px; padding: 16px; border-radius: 14px; }
  .atk-portraits img { width: 64px; height: 64px; }
  .sector-grid { grid-template-columns: 1fr 1fr; }
  .tab { padding: 12px 4px; font-size: 0.72rem; min-height: 44px; display: flex; align-items: center; justify-content: center; }
  body { padding-bottom: env(safe-area-inset-bottom); }
}

@media (max-width: 480px) {
  .leader-grid { grid-template-columns: 1fr 1fr; }
  .res-item { font-size: 0.7rem; padding: 4px 7px; }
  .logo-img { max-width: 180px; }
  .start-btn { width: 100%; max-width: 280px; padding: 14px; font-size: 1rem; }
}


/* ===== ADVANCED POKÉMON-STYLE BATTLE ===== */
.modal.battle-modal { max-width: 640px; padding: 12px 16px 16px; }
.poke-battle { text-align: center; }
.poke-field {
  display: flex; justify-content: space-between; align-items: flex-end;
  min-height: 220px; margin: 8px 0 4px; position: relative;
  background: radial-gradient(ellipse at 50% 100%, #0a1a14 0%, #07080c 70%);
  border-radius: 10px; padding: 12px 16px; border: 1px solid var(--border);
}
.poke-enemy { text-align: right; flex: 1; position: relative; }
.poke-player { text-align: left; flex: 1; position: relative; }
.poke-sprite {
  width: 120px; height: 120px; object-fit: contain;
  background: transparent; border-radius: 8px; transition: all 0.25s;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
}
.poke-sprite.hurt { animation: pokeHurt 0.55s ease; }
.poke-sprite.attack { animation: pokeAttack 0.4s ease; }
.poke-sprite.faint { animation: pokeFaint 0.9s ease forwards; }
.poke-sprite.enemy-attack { animation: pokeEnemyAttack 0.4s ease; }
@keyframes pokeHurt {
  0%,100%{transform:translateX(0);filter:brightness(1) drop-shadow(0 4px 8px rgba(0,0,0,0.5))}
  15%,50%{transform:translateX(-10px);filter:brightness(2.5) drop-shadow(0 0 12px #ff3b5c)}
  30%,70%{transform:translateX(10px)}
}
@keyframes pokeAttack {
  0%{transform:translateX(0)} 35%{transform:translateX(28px) scale(1.05)} 100%{transform:translateX(0)}
}
@keyframes pokeEnemyAttack {
  0%{transform:translateX(0)} 35%{transform:translateX(-28px) scale(1.05)} 100%{transform:translateX(0)}
}
@keyframes pokeFaint {
  0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(40px) rotate(8deg)}
}
.poke-hp-box {
  background: linear-gradient(180deg, #1a2030 0%, #0f1118 100%);
  border: 2px solid var(--border); border-radius: 8px;
  padding: 8px 12px; margin: 4px 0; display: inline-block;
  min-width: 160px; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.poke-hp-box .name { font-weight: 800; font-size: 0.88rem; letter-spacing: 0.3px; }
.poke-hp-box .lvl { font-size: 0.65rem; color: var(--muted); }
.poke-hp-bar { height: 10px; background: #0a0c12; border-radius: 5px; overflow: hidden; margin-top: 4px; border: 1px solid #1a2030; }
.poke-hp-fill { height: 100%; border-radius: 4px; transition: width 0.7s ease; }
.poke-log {
  font-size: 0.9rem; min-height: 42px; margin: 10px 0 6px;
  color: var(--text); font-weight: 600; background: var(--panel2);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
  text-align: left; line-height: 1.4;
}
.poke-moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.poke-move {
  background: linear-gradient(180deg, #1a2030 0%, #12151e 100%);
  border: 2px solid var(--border); border-radius: 10px;
  padding: 12px 14px; cursor: pointer; text-align: left;
  font-size: 0.85rem; font-weight: 700; transition: all 0.15s;
}
.poke-move:hover { border-color: var(--accent); background: #1e2535; transform: scale(1.02); }
.poke-move:active { transform: scale(0.98); }
.poke-move .pp { font-size: 0.68rem; color: var(--muted); margin-top: 2px; font-weight: 500; }
.poke-move.disabled { opacity: 0.4; pointer-events: none; }
.poke-actions { display: flex; gap: 8px; margin-top: 10px; }
.poke-actions .btn { flex: 1; padding: 10px; font-size: 0.8rem; }
.dmg-float {
  position: absolute; font-size: 1.4rem; font-weight: 900;
  color: var(--danger); text-shadow: 0 0 8px rgba(255,59,92,0.6);
  animation: dmgFloat 0.9s ease forwards; pointer-events: none; z-index: 10;
}
@keyframes dmgFloat {
  0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-40px) scale(1.2)}
}


/* ===== SHIP TRAVEL ===== */
.travel-scene {
  text-align: center; padding: 10px 0; min-height: 280px;
  background: radial-gradient(ellipse at 50% 30%, #0a1520 0%, #07080c 60%);
  border-radius: 10px; border: 1px solid var(--border); position: relative; overflow: hidden;
}
.travel-stars {
  position: absolute; inset: 0; background-image:
    radial-gradient(1px 1px at 20px 30px, #fff, transparent),
    radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 50px 160px, #fff, transparent),
    radial-gradient(1.5px 1.5px at 90px 40px, rgba(0,229,160,0.5), transparent),
    radial-gradient(1px 1px at 130px 80px, #fff, transparent),
    radial-gradient(1px 1px at 160px 120px, rgba(255,255,255,0.4), transparent);
  background-size: 200px 200px; animation: starScroll 8s linear infinite; opacity: 0.6;
}
@keyframes starScroll { from{background-position:0 0} to{background-position:0 -200px} }
.travel-ship {
  font-size: 3rem; position: relative; z-index: 2;
  animation: shipBob 2s ease-in-out infinite; margin: 20px 0 8px;
  filter: drop-shadow(0 0 12px rgba(0,180,216,0.5));
}
@keyframes shipBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

<script>

{id:'mike',name:'Mike',rank:'Captain',last:'Draven',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/mike_orig.png',bonus:'Assault',age:41,home:'Mars Frontier',service:'18 years',bio:'Career soldier. Fought in three colonial wars before the Vorrh. Survived the Fall of Red Mesa with only a combat knife. Has a prosthetic left arm he refuses to upgrade. Married once; she left when he kept volunteering for the worst deployments. The men follow him because he never asks them to do anything he would not do first.',trait:'Squad starts with +10 HP. Leads from the front.'},
{id:'gritt',name:'Gritt',rank:'Sergeant',last:'Kane',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/grift_orig.png',bonus:'Hardened',age:38,home:'Europa Ice Stations',service:'15 years',bio:'Grew up in the freezing mining colonies of Europa. Once held a corridor alone for six hours against a Vorrh swarm while his platoon evacuated. Scars on his neck are from a Husk that almost took his head. Speaks rarely. Carves a notch into his rifle stock for every confirmed kill.',trait:'Squad takes reduced Sanity damage.'},
{id:'duke',name:'Duke',rank:'Corporal',last:'Reyes',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/duke_orig.png',bonus:'Recon',age:29,home:'Orbital Station K-7',service:'7 years',bio:'Former deep-space scout. Spent two years alone on long-range recon. Can move through Vorrh-held ground without triggering alarms. Lost his entire original scout team on Delta Ruins — only he made it out. Still hears their voices on the comms some nights.',trait:'Better sector intel. Higher chance to detect ambushes.'},
{id:'vanessa',name:'Vanessa',rank:'Lieutenant',last:'Cross',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/vanessa_orig.png',bonus:'Tactical',age:32,home:'Earth (Old Europe)',service:'9 years',bio:'Tactical prodigy. Designed the defence grid that held Alpha Ridge for the first three weeks. Keeps a running probability model of every engagement in her head. Lost her fiancée in the first wave — she has not spoken of it since. Precision is how she stays sane.',trait:'Weapons cost 20% less.'},
{id:'savannah',name:'Savannah',rank:'Specialist',last:'Holt',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/savannah_orig.png',bonus:'Tech',age:27,home:'Titan Shipyards',service:'5 years',bio:'Engineering specialist. Reverse-engineered the first captured Vorrh signal jammer. Has a neural interface implant that lets her feel machine systems. The implant occasionally gives her headaches that look like seizures. She hides them. Believes the Vorrh are not just biological.',trait:'Vehicles and tech systems more effective.'}
];

{id:'mike2',name:'Cpl. Mike Torres',rank:'Corporal',role:'Heavy',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/mike_orig.png',hp:95,san:60},
{id:'susan2',name:'Lt. Susan Voss',rank:'Lieutenant',role:'Medic',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/suszan_orig.png',hp:70,san:90},
{id:'gritt2',name:'Sgt. Gritt Kane',rank:'Sergeant',role:'Warden',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/grift_orig.png',hp:110,san:55},
{id:'duke2',name:'Cpl. Duke Reyes',rank:'Corporal',role:'Scout',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/duke_orig.png',hp:75,san:80},
{id:'van2',name:'Lt. Vanessa Cross',rank:'Lieutenant',role:'Tactician',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/vanessa_orig.png',hp:80,san:85},
{id:'sav2',name:'Spc. Savannah Holt',rank:'Specialist',role:'Engineer',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/savannah_orig.png',hp:70,san:75}
];
const MARK3={id:'mark3',name:'Mark-3 Heavy',rank:'Elite',role:'Assault',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/makr31_orig.png',hp:140,san:50,cost:85,desc:'Experimental heavy infantry. Extremely tough.'};
const VORRH=[
{name:'Vorrh Drone',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/inf-3_orig.png',hp:40,dmg:8,sanDmg:5},
{name:'Vorrh Stalker',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/inf4_orig.png',hp:55,dmg:12,sanDmg:12},
{name:'Vorrh Warrior',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/inf2_orig.png',hp:75,dmg:16,sanDmg:8},

const VEHICLES=[
{id:'apc',name:'T2 APC',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/t2_orig.png',type:'transport',cost:60},
{id:'tank',name:'Main Battle Tank',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/t1_orig.png',type:'armor',cost:90},
{id:'alien_tank',name:'Captured Vorrh Tank',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/al2_orig.png',type:'armor',cost:120},

const WEAPONS_STORE=[
{id:'w1',name:'M251 Pulse',dmg:18,effect:'standard',cost:25,img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/m5_orig.png',desc:'Reliable standard issue'},
{id:'w2',name:'Grinder',dmg:28,effect:'bleed',cost:45,img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/212_orig.png',desc:'Shreds organic armour'},
{id:'w3',name:'PulseStopper',dmg:22,effect:'stun',cost:40,img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/213_orig.png',desc:'Disrupts Vorrh signals'},
{id:'w4',name:'M27B',dmg:32,effect:'pierce',cost:55,img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/b-ea_orig.png',desc:'High-velocity penetrator'},
{id:'w5',name:'Sanity Anchor',dmg:10,effect:'san+12',cost:35,img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/m5_orig.png',desc:'Stabilizes the mind under fire'}
];

const BUILDINGS_DEF = [
  {id:'barracks', name:'Barracks', img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/eclaf_orig.jpg', cost:{scrap:40}, time:15, desc:'Recruit and organize infantry. Enables squad management.'},
  {id:'medbay', name:'Medbay', img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/uoeso_orig.jpg', cost:{scrap:35,bio:10}, time:12, desc:'Heal wounded units and restore sanity.'},
  {id:'forge', name:'Forge', img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/almta_orig.jpg', cost:{scrap:50}, time:18, desc:'Produce weapons and vehicle parts.'},
  {id:'lab', name:'Research Lab', img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/image-2026-07-21t212042-276_orig.jpg', cost:{scrap:30,void:8}, time:20, desc:'Unlock research and improve tech.'},
  {id:'sanctuary', name:'Sanctuary', img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/i5sgx_orig.jpg', cost:{bio:20,void:6}, time:16, desc:'Mental fortification. Reduces sanity loss.'}
];

const SECTORS=[
{id:'alpha',name:'Alpha Ridge',status:'secured',unlocked:true,threat:1,desc:'Landing zone.'},
{id:'bravo',name:'Bravo Basin',status:'contested',unlocked:true,threat:2,desc:'Resource-rich lowlands.'},
{id:'charlie',name:'Charlie Spire',status:'hot',unlocked:false,threat:3,desc:'High ground. Strong Vorrh presence.'},
{id:'delta',name:'Delta Ruins',status:'unknown',unlocked:false,threat:3,desc:'Ancient structures. Strange signals.'},
{id:'echo',name:'Echo Depths',status:'locked',unlocked:false,threat:4,desc:'Deep hive tunnels.'},
{id:'foxtrot',name:'Foxtrot Gate',status:'locked',unlocked:false,threat:5,desc:'Suspected Vorrh command node.'}
];
let state={leader:null,scrap:100,bio:40,void:15,sanity:100,pool:[],sectorSquads:{},weapons:[],vehicles:[],buildings:[],squads:[],sectors:JSON.parse(JSON.stringify(SECTORS)),currentSector:null,phase:'outpost',selectedUnit:null,enemies:[],mission:0,turn:0,retreatedThisTurn:false,trapped:false,transmissions:[],radarContacts:[],lastScan:0,namedSquads:{}};

function saveGame(){
  try{
    const data = JSON.stringify(state);
    localStorage.setItem('hive_save', data);
    toast('Game saved','ok');
  }catch(e){toast('Save failed','warn');}
}
function loadGame(){
  try{
    const raw = localStorage.getItem('hive_save');
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data || !data.leader || !data.leader.id) return false;
    Object.assign(state, data);
    // Ensure arrays exist
    if(!state.pool) state.pool = [];
    if(!state.sectorSquads) state.sectorSquads = {};
    if(!state.weapons) state.weapons = [];
    if(!state.vehicles) state.vehicles = [];
    if(!state.buildings) state.buildings = [];
    if(!state.transmissions) state.transmissions = [];
    if(!state.sectors) state.sectors = JSON.parse(JSON.stringify(SECTORS));
    document.getElementById('titleScreen').classList.remove('active');
    document.getElementById('game').classList.add('active');
    document.getElementById('cmdName').textContent = state.leader.rank+' '+state.leader.name+' '+state.leader.last;
    renderAll();
    toast('Game loaded','ok');
    return true;
  }catch(e){
    console.error('Load failed', e);
    localStorage.removeItem('hive_save');
    return false;
  }
}
function resetGame(){
  if(!confirm('Reset all progress? This cannot be undone.')) return;
  localStorage.removeItem('hive_save');
  location.reload();
}


function init(){
const grid=document.getElementById('leaderGrid');
LEADERS.forEach(l=>{
const card=document.createElement('div');card.className='leader-card';
card.innerHTML=`<img src="${l.img}" alt="${l.name}"><h3>${l.rank} ${l.name} ${l.last}</h3><div class="rank">${l.bonus}</div>`;
card.onclick=()=>{document.querySelectorAll('.leader-card').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');state.leader=l;document.getElementById('startBtn').disabled=false;showLeaderDossier(l);};
grid.appendChild(card);
});
document.getElementById('startBtn').onclick=startGame;
document.querySelectorAll('.tabs').forEach(tabBar=>{
tabBar.querySelectorAll('.tab').forEach(tab=>{
tab.onclick=()=>{tabBar.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');
const side=tabBar.closest('.panel').querySelector('.panel-b').id;
if(side==='leftPanel')renderLeft(tab.dataset.tab);else renderRight(tab.dataset.tab);};
});
});
}
function showLeaderDossier(l){
showDetail(`${l.rank} ${l.name} ${l.last}`,`
<img src="${l.img}" style="width:140px;height:140px;object-fit:contain;border-radius:10px;background:#0a0c12;margin-bottom:10px">
<div class="bio-grid">
<div class="bio-item"><div class="label">AGE</div>${l.age}</div>
<div class="bio-item"><div class="label">HOME</div>${l.home}</div>
<div class="bio-item"><div class="label">SERVICE</div>${l.service}</div>
<div class="bio-item"><div class="label">TRAIT</div>${l.bonus}</div>
</div>
<div class="bio-story">${l.bio}</div>
<div style="font-size:.72rem;color:var(--accent);margin-top:6px"><em>${l.trait}</em></div>
`,[{text:'Confirm Selection',action:closeDetail}]);
}
function startGame(){
if(!state.leader)return;
const startIds=['sarge','duke2'];
if(state.leader.bonus==='Assault')startIds.push('mike2');
if(state.leader.bonus==='Support')startIds.push('susan2');
if(state.leader.bonus==='Hardened')startIds.push('gritt2');
if(state.leader.bonus==='Tech')startIds.push('sav2');
if(state.leader.bonus==='Tactical')startIds.push('van2');
if(startIds.length<3)startIds.push('sarge');
state.pool=startIds.map((id,i)=>{
const s=SOLDIERS.find(x=>x.id===id)||SOLDIERS[0];
return{id:'u'+i,name:s.name,rank:s.rank,role:s.role,img:s.img,hp:s.hp+(state.leader.bonus==='Assault'?10:0),maxHp:s.hp+(state.leader.bonus==='Assault'?10:0),san:s.san,maxSan:s.san,weapon:null,status:'stable',acted:false,sector:null,upgrades:[]};
});
state.weapons=[{id:'sw1',name:'M251 Pulse',dmg:16,effect:'standard',img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/m5_orig.png'}];
document.getElementById('titleScreen').classList.remove('active');
document.getElementById('game').classList.add('active');
document.getElementById('cmdName').textContent=`${state.leader.rank} ${state.leader.name} ${state.leader.last}`;
addTx('Command','Hive Command online.','ok');
renderAll();
showDetail(`Welcome, ${state.leader.rank} ${state.leader.name}`,`The Vorrh have taken the surface. They do not conquer — they convert. You are the last organised command. Deploy carefully. Some transmissions will stop mid-sentence.`,[{text:'Acknowledged',action:closeDetail}]);
}
function getCurrentSquad(){return state.currentSector?(state.sectorSquads[state.currentSector]||[]):[];}
function renderAll(){updateRes();renderLeft(document.querySelector('#leftPanel')?.closest('.panel')?.querySelector('.tab.active')?.dataset.tab||'sectors');renderRight(document.querySelector('#rightPanel')?.closest('.panel')?.querySelector('.tab.active')?.dataset.tab||'squad');renderBattlefield();}
function updateRes(){document.getElementById('resScrap').textContent=state.scrap;document.getElementById('resBio').textContent=state.bio;document.getElementById('resVoid').textContent=state.void;document.getElementById('cmdSanity').style.width=Math.max(0,state.sanity)+'%';}
function renderLeft(tab){
const p=document.getElementById('leftPanel');
if(tab==='sectors'){p.innerHTML='<div class="sector-grid"></div>';const grid=p.querySelector('.sector-grid');
state.sectors.forEach(s=>{const deployed=(state.sectorSquads[s.id]||[]).length;const el=document.createElement('div');
el.className='sector'+(s.unlocked?'':' locked')+(state.currentSector===s.id?' active':'')+(s.status==='hot'?' hot':'');
el.innerHTML=`<div class="sector-name">${s.name}</div><div class="sector-status">${s.unlocked?s.status.toUpperCase():'LOCKED'} • T${s.threat}</div>${deployed?`<div class="sector-deployed">${(state.namedSquads&&state.namedSquads[s.id])||'Squad'} • ${deployed}</div>`:''}`;
if(s.unlocked)el.onclick=()=>selectSector(s.id);grid.appendChild(el);});
}else if(tab==='command'){p.innerHTML=`<div class="radar-box"><div class="radar-circle" id="radarCircle"><div class="radar-sweep"></div></div><div style="font-size:.7rem;color:var(--muted)">RADAR — LIVE</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px"><div class="btn" style="font-size:.62rem;padding:5px" onclick="viewCam('N')">N</div><div class="btn" style="font-size:.62rem;padding:5px" onclick="viewCam('E')">E</div><div class="btn" style="font-size:.62rem;padding:5px" onclick="viewCam('S')">S</div><div class="btn" style="font-size:.62rem;padding:5px" onclick="viewCam('W')">W</div></div></div>
<button class="btn" style="width:100%;margin-top:5px" onclick="runScan()">FORCE SCAN</button>`;updateRadarBlips();
}else if(tab==='store'){p.innerHTML='<div style="font-size:.7rem;color:var(--muted);margin-bottom:5px">WEAPONS & UNITS</div>';
const m3=document.createElement('div');m3.className='store-item';
m3.innerHTML=`<img src="${MARK3.img}"><div class="store-info"><strong>${MARK3.name}</strong><small>HP 140 • Elite<br>${MARK3.desc}</small></div><div class="store-cost">${MARK3.cost}⚙️</div>`;
m3.onclick=buyMark3;p.appendChild(m3);
WEAPONS_STORE.forEach(w=>{const el=document.createElement('div');el.className='store-item';
el.innerHTML=`${w.img?`<img src="${w.img}">`:'<div style="width:48px;height:34px;background:#0a0c12;border-radius:3px"></div>'}<div class="store-info"><strong>${w.name}</strong><small>DMG ${w.dmg} • ${w.effect}<br>${w.desc}</small></div><div class="store-cost">${w.cost}⚙️</div>`;
el.onclick=()=>showWeaponDetail(w);p.appendChild(el);});
} else if(tab==='build'){
  p.innerHTML='<div style="font-size:.7rem;color:var(--muted);margin-bottom:6px">OUTPOST CONSTRUCTION</div>';
  BUILDINGS_DEF.forEach(b=>{
    const owned = (state.buildings||[]).find(x=>x.id===b.id);
    const el = document.createElement('div');
    el.className = 'store-item';
    if(owned){
      if(owned.building){
        const total = (owned.readyAt - owned.startedAt) || (b.time*1000);
        const elapsed = Date.now() - (owned.startedAt || (owned.readyAt - total));
        const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
        const left = Math.max(0, Math.ceil((owned.readyAt - Date.now())/1000));
        el.innerHTML = '<img src="'+b.img+'" style="width:64px;height:48px;object-fit:cover;border-radius:4px"><div class="store-info" style="flex:1"><strong>'+b.name+'</strong><small>Constructing... '+left+'s</small><div class="build-progress"><div class="build-progress-fill" style="width:'+pct+'%"></div></div></div><div class="store-cost">⏳</div>';
      } else {
        el.innerHTML = '<img src="'+b.img+'" style="width:64px;height:48px;object-fit:cover;border-radius:4px"><div class="store-info"><strong>'+b.name+'</strong><small>ONLINE — Click to manage</small></div><div class="store-cost" style="color:var(--ok)">✓</div>';
        el.onclick = ()=>useBuilding(b.id);
      }
    } else {
      const costStr = Object.entries(b.cost).map(([k,v])=>v+(k==='scrap'?'⚙️':k==='bio'?'🧬':'💎')).join(' ');
      el.innerHTML = '<img src="'+b.img+'" style="width:64px;height:48px;object-fit:cover;border-radius:4px"><div class="store-info"><strong>'+b.name+'</strong><small>'+b.desc+'<br>Build time: '+b.time+'s</small></div><div class="store-cost">'+costStr+'</div>';
      el.onclick = ()=>startBuild(b);
    }
    p.appendChild(el);
  });
}
}

function renderRight(tab){
const p=document.getElementById('rightPanel');
if(tab==='squad'){p.innerHTML='';const squad=getCurrentSquad();
if(!squad.length&&!state.pool.length){p.innerHTML='<div class="empty">No personnel</div>';return;}
if(state.pool.length){const h=document.createElement('div');h.style.cssText='font-size:.65rem;color:var(--muted);margin-bottom:3px';h.textContent='AVAILABLE (OUTPOST)';p.appendChild(h);
state.pool.forEach(u=>{const el=makeUnitCard(u);el.onclick=()=>openUnit(u.id,'pool');p.appendChild(el);});}
if(squad.length){const h=document.createElement('div');h.style.cssText='font-size:.65rem;color:var(--accent);margin:7px 0 3px';h.textContent=`DEPLOYED — ${(state.sectors.find(s=>s.id===state.currentSector)||{}).name||'SECTOR'}`;p.appendChild(h);
squad.forEach(u=>{const el=makeUnitCard(u);el.onclick=()=>openUnit(u.id,'sector');p.appendChild(el);});}
}else if(tab==='vehicles'){p.innerHTML='';if(!state.vehicles.length){p.innerHTML='<div class="empty">No vehicles</div>';VEHICLES.slice(0,2).forEach(v=>{const el=document.createElement('div');el.className='veh-card';el.innerHTML=`<img src="${v.img}"><div><strong style="font-size:.75rem">${v.name}</strong><div style="font-size:.6rem;color:var(--muted)">${v.cost}⚙️</div></div>`;el.onclick=()=>showVehicleDetail(v);p.appendChild(el);});}
else{state.vehicles.forEach(v=>{const el=document.createElement('div');el.className='veh-card'+(v.deployed?' deployed':'');el.innerHTML=`<img src="${v.img}"><div><strong style="font-size:.75rem">${v.name}</strong><div style="font-size:.6rem;color:var(--muted)">${v.deployed?'DEPLOYED':'Available'}</div></div>`;el.onclick=()=>{v.deployed=!v.deployed;toast(v.deployed?v.name+' deployed':v.name+' recalled','ok');renderRight('vehicles');};p.appendChild(el);});}
}else if(tab==='tx'){p.innerHTML='';if(!state.transmissions.length)p.innerHTML='<div class="empty">No transmissions</div>';
state.transmissions.slice().reverse().forEach(t=>{const el=document.createElement('div');el.className='tx-item '+(t.type||'');el.innerHTML=`<div class="tx-time">${t.from} — ${t.time}</div>${t.msg}`;p.appendChild(el);});}
}
function makeUnitCard(u){const el=document.createElement('div');el.className='unit-card'+(u.acted?' acted':'')+(state.selectedUnit===u.id?' selected':'');
const hp=Math.max(0,(u.hp/u.maxHp)*100);const san=Math.max(0,(u.san/u.maxSan)*100);
el.innerHTML=`<img src="${u.img}"><div style="flex:1;min-width:0"><div class="unit-name">${u.name}</div><div class="unit-role">${u.rank} • ${u.role}</div><div class="bar"><div class="bar-fill hp-fill" style="width:${hp}%"></div></div><div class="bar"><div class="bar-fill san-fill" style="width:${san}%"></div></div></div>`;return el;}
function renderBattlefield(){
const ps=document.getElementById('playerSide'),es=document.getElementById('enemySide');ps.innerHTML='';es.innerHTML='';
if(state.phase!=='combat'){ps.innerHTML='<div class="empty">Deploy a squad</div>';es.innerHTML='<div class="empty">No contacts</div>';return;}
const squad=getCurrentSquad();
squad.filter(u=>u.hp>0).forEach(u=>{const el=document.createElement('div');el.className='combat-card'+(state.selectedUnit===u.id?' selected':'')+(u.acted?' acted':'');
const hp=Math.max(0,(u.hp/u.maxHp)*100);
el.innerHTML=`<img src="${u.img}"><div><div style="font-weight:700;font-size:.75rem">${u.name}</div><div class="bar" style="width:65px"><div class="bar-fill hp-fill" style="width:${hp}%"></div></div></div>`;
el.onclick=()=>{if(u.acted){toast(u.name+' already acted','warn');return;}state.selectedUnit=u.id;renderBattlefield();toast(u.name+' selected','ok');};ps.appendChild(el);});
if(!state.enemies.length)es.innerHTML='<div class="empty">Sector clear</div>';
else state.enemies.forEach((e,i)=>{const el=document.createElement('div');el.className='combat-card enemy'+(e.hp<=0?' dead':'');
const hp=Math.max(0,(e.hp/e.maxHp)*100);
el.innerHTML=`<img src="${e.img}"><div><div style="font-weight:700;font-size:.75rem">${e.name}</div><div class="bar" style="width:65px"><div class="bar-fill" style="width:${hp}%;background:linear-gradient(90deg,#ff3b5c,#ff6b81)"></div></div></div>`;
el.onclick=()=>{if(e.hp<=0)return;if(!state.selectedUnit){toast('Select a unit first','warn');return;}performAttack(state.selectedUnit,i);};es.appendChild(el);});
}
function selectSector(id){const s=state.sectors.find(x=>x.id===id);if(!s||!s.unlocked)return;state.currentSector=id;
document.getElementById('missionTitle').textContent=s.name;document.getElementById('missionSub').textContent=s.desc+(state.sectorSquads[id]?.length?` • ${state.sectorSquads[id].length} deployed`:'');
if(state.phase==='combat'){state.phase='outpost';state.enemies=[];document.getElementById('missionPhase').textContent='OUTPOST';document.getElementById('btnDeploy').style.display='inline-block';document.getElementById('btnEndTurn').style.display='none';document.getElementById('btnRetreat').style.display='none';document.getElementById('btnExtract').style.display='none';}
renderAll();}
function tryDeploy(){
if(!state.currentSector){toast('Select a sector first','warn');return;}
if(!state.sectorSquads[state.currentSector]||!state.sectorSquads[state.currentSector].length){
if(!state.pool.length){toast('No units available at outpost','danger');return;}
// Name the squad
const names = ['Alpha','Bravo','Charlie','Delta','Echo','Foxtrot','Golf','Hotel'];
const used = Object.values(state.namedSquads||{});
const available = names.filter(n=>!used.includes(n));
const squadName = available[0] || ('Squad-'+Date.now().toString().slice(-4));
const toDeploy=state.pool.splice(0,Math.min(4,state.pool.length));
toDeploy.forEach(u=>{u.sector=state.currentSector;u.acted=false;});
state.sectorSquads[state.currentSector]=toDeploy;
if(!state.namedSquads) state.namedSquads={};
state.namedSquads[state.currentSector]=squadName;
toast(`Squad ${squadName} deployed (${toDeploy.length} units)`,'ok');
saveGame();
}
const squad=getCurrentSquad().filter(u=>u.hp>0);if(!squad.length){toast('No living units in this sector','danger');return;}
if(Math.random()<0.2&&state.mission>0){addTx('Unknown','Command... we found— ████ *screaming*','danger');
showDetail('Distress Signal','A previous transmission just cut out mid-sentence.',[{text:'Investigate',action:()=>{closeDetail();beginCombat();}},{text:'Proceed carefully',action:()=>{closeDetail();beginCombat();}}]);return;}
beginCombat();
}
function beginCombat(){
const sector=state.sectors.find(s=>s.id===state.currentSector);
state.phase='combat';state.mission++;state.turn=1;state.selectedUnit=null;state.retreatedThisTurn=false;
state.trapped=Math.random()<0.2+(sector?.threat||1)*0.07;getCurrentSquad().forEach(u=>u.acted=false);
const count=Math.min(2+(sector?.threat||1),5);state.enemies=[];
for(let i=0;i<count;i++){const t=VORRH[Math.min((sector?.threat||1)-1+Math.floor(Math.random()*2),VORRH.length-1)];
state.enemies.push({name:t.name,img:t.img,hp:t.hp+Math.floor(Math.random()*12),maxHp:t.hp+12,dmg:t.dmg,sanDmg:t.sanDmg});}
document.getElementById('missionPhase').textContent='COMBAT';document.getElementById('btnDeploy').style.display='none';
document.getElementById('btnEndTurn').style.display='inline-block';document.getElementById('btnRetreat').style.display='inline-block';document.getElementById('btnExtract').style.display='inline-block';
addTx('Squad',`Contact in ${sector?.name}. ${count} Vorrh.`,'warn');toast(`Engaging ${count} Vorrh`,'danger');renderBattlefield();renderRight('squad');
}



function getMovesForUnit(unit){
  const base = unit.weapon ? unit.weapon.dmg : 12;
  const role = (unit.role || '').toLowerCase();
  const name = (unit.name || '').toLowerCase();

  // Default kit
  let moves = [
    { name: unit.weapon ? unit.weapon.name : 'Rifle Fire', dmg: base, type: 'WEAPON', desc: 'Standard attack' },
    { name: 'Burst', dmg: Math.floor(base*0.7), type: 'RAPID', desc: 'Quick volley' },
    { name: 'Aimed Shot', dmg: Math.floor(base*1.3), type: 'PRECISION', desc: 'High damage' },
    { name: 'Suppress', dmg: Math.floor(base*0.45), type: 'TACTICAL', desc: 'Debuff enemy', debuff: true }
  ];

  // Role / character specific overrides
  if(role.includes('medic') || name.includes('susan')){
    moves = [
      { name: unit.weapon ? unit.weapon.name : 'Sidearm', dmg: Math.floor(base*0.9), type: 'WEAPON', desc: 'Sidearm shot' },
      { name: 'Stim Shot', dmg: 0, type: 'SUPPORT', desc: 'Restore 20 HP to self', heal: 20 },
      { name: 'Neuro-Calm', dmg: 0, type: 'SUPPORT', desc: 'Restore sanity', sanHeal: 15 },
      { name: 'Point Blank', dmg: Math.floor(base*1.2), type: 'PRECISION', desc: 'Close-range shot' }
    ];
  } else if(role.includes('heavy') || role.includes('breacher') || name.includes('mike') || name.includes('harlan')){
    moves = [
      { name: unit.weapon ? unit.weapon.name : 'Heavy Rifle', dmg: base, type: 'WEAPON', desc: 'Primary fire' },
      { name: 'Suppressing Barrage', dmg: Math.floor(base*0.8), type: 'RAPID', desc: 'Area pressure', debuff: true },
      { name: 'Breach Charge', dmg: Math.floor(base*1.5), type: 'EXPLOSIVE', desc: 'Devastating blast' },
      { name: 'Fortify', dmg: 0, type: 'DEFENSE', desc: 'Reduce next damage taken', fortify: true }
    ];
  } else if(role.includes('scout') || role.includes('recon') || name.includes('duke')){
    moves = [
      { name: unit.weapon ? unit.weapon.name : 'Scout Rifle', dmg: base, type: 'WEAPON', desc: 'Clean shot' },
      { name: 'Weak Point', dmg: Math.floor(base*1.4), type: 'PRECISION', desc: 'Critical targeting' },
      { name: 'Smoke Disengage', dmg: 0, type: 'TACTICAL', desc: 'Guaranteed escape next flee', smoke: true },
      { name: 'Mark Target', dmg: Math.floor(base*0.5), type: 'TACTICAL', desc: 'Debuff + reveal', debuff: true }
    ];
  } else if(role.includes('warden') || name.includes('gritt') || role.includes('assault')){
    moves = [
      { name: unit.weapon ? unit.weapon.name : 'Combat Rifle', dmg: base, type: 'WEAPON', desc: 'Steady fire' },
      { name: 'Hold the Line', dmg: Math.floor(base*0.6), type: 'DEFENSE', desc: 'Attack + fortify', fortify: true },
      { name: 'Execution Shot', dmg: Math.floor(base*1.45), type: 'PRECISION', desc: 'Finishing round' },
      { name: 'Bayonet', dmg: Math.floor(base*1.1), type: 'MELEE', desc: 'Close combat' }
    ];
  } else if(role.includes('engineer') || role.includes('tech') || name.includes('savannah') || name.includes('holt')){
    moves = [
      { name: unit.weapon ? unit.weapon.name : 'Pulse Tool', dmg: Math.floor(base*0.85), type: 'WEAPON', desc: 'Energy discharge' },
      { name: 'Overcharge', dmg: Math.floor(base*1.5), type: 'TECH', desc: 'Overloaded shot' },
      { name: 'EMP Burst', dmg: Math.floor(base*0.7), type: 'TECH', desc: 'Disrupt + debuff', debuff: true },
      { name: 'Repair Protocols', dmg: 0, type: 'SUPPORT', desc: 'Self-repair 15 HP', heal: 15 }
    ];
  } else if(role.includes('tactician') || name.includes('vanessa') || name.includes('cross')){
    moves = [
      { name: unit.weapon ? unit.weapon.name : 'Carbine', dmg: base, type: 'WEAPON', desc: 'Calculated shot' },
      { name: 'Coordinated Fire', dmg: Math.floor(base*1.25), type: 'TACTICAL', desc: 'Precision doctrine' },
      { name: 'Reposition', dmg: 0, type: 'TACTICAL', desc: 'Fortify + prep', fortify: true },
      { name: 'Exploit Gap', dmg: Math.floor(base*1.35), type: 'PRECISION', desc: 'Target weakness' }
    ];
  } else if(role.includes('elite') || name.includes('mark-3') || name.includes('mark 3')){
    moves = [
      { name: 'Heavy Cannon', dmg: Math.floor(base*1.2), type: 'WEAPON', desc: 'Mark-3 primary' },
      { name: 'Shatter Round', dmg: Math.floor(base*1.6), type: 'EXPLOSIVE', desc: 'Armor-piercing' },
      { name: 'Shield Wall', dmg: 0, type: 'DEFENSE', desc: 'Heavy fortify', fortify: true },
      { name: 'Sweep Fire', dmg: Math.floor(base*0.9), type: 'RAPID', desc: 'Sustained fire', debuff: true }
    ];
  }

  // Upgrades from unit.upgrades if present
  if(unit.upgrades && unit.upgrades.length){
    unit.upgrades.forEach(up => {
      if(up === 'overcharge') moves[0].dmg = Math.floor(moves[0].dmg * 1.15);
      if(up === 'veteran') moves.forEach(m => { if(m.dmg>0) m.dmg = Math.floor(m.dmg*1.1); });
    });
  }
  return moves;
}


let battleState = null;

function performAttack(unitId, enemyIdx){
  const squad = getCurrentSquad();
  const unit = squad.find(u => u.id === unitId);
  const enemy = state.enemies[enemyIdx];
  if(!unit || !enemy || unit.hp <= 0 || enemy.hp <= 0){ toast('Unit is down or invalid','warn'); return; }
  if(unit.acted){ toast(unit.name + ' already acted','warn'); return; }
  battleState = { unit, enemyIdx, enemy, turn: 'player', canFlee: true };
  openPokeBattle(unit, enemy);
}

function openPokeBattle(unit, enemy){
  const moves = getMovesForUnit(unit);

  const box = document.getElementById('detailBox');
  box.classList.add('wide', 'battle-modal');
  box.innerHTML = `
    <button class="modal-close" onclick="attemptFlee()" title="Flee">×</button>
    <div class="poke-battle">
      <div class="poke-field">
        <div class="poke-player">
          <div class="poke-hp-box">
            <div class="name">${unit.name}</div>
            <div class="lvl">${unit.rank} • ${unit.role}</div>
            <div class="poke-hp-bar"><div class="poke-hp-fill hp-fill" id="pokePlayerHp" style="width:${Math.max(0,unit.hp/unit.maxHp*100)}%"></div></div>
            <div style="font-size:0.7rem;color:var(--muted);margin-top:2px">${Math.max(0,unit.hp)} / ${unit.maxHp} HP</div>
          </div>
          <img class="poke-sprite" id="pokePlayerSprite" src="${unit.img}" alt="">
        </div>
        <div class="poke-enemy">
          <div class="poke-hp-box">
            <div class="name" style="color:var(--danger)">${enemy.name}</div>
            <div class="lvl">Vorrh • Hostile</div>
            <div class="poke-hp-bar"><div class="poke-hp-fill" id="pokeEnemyHp" style="width:${Math.max(0,enemy.hp/enemy.maxHp*100)}%;background:linear-gradient(90deg,#ff3b5c,#ff6b81)"></div></div>
            <div style="font-size:0.7rem;color:var(--muted);margin-top:2px">${Math.max(0,enemy.hp)} / ${enemy.maxHp} HP</div>
          </div>
          <img class="poke-sprite" id="pokeEnemySprite" src="${enemy.img}" alt="">
        </div>
      </div>
      <div class="poke-log" id="pokeLog">What will ${unit.name} do?</div>
      <div class="poke-moves" id="pokeMoves"></div>
      <div class="poke-actions">
        <button class="btn" onclick="attemptFlee()">FLEE</button>
        <button class="btn" onclick="closeBattleMenu()">BACK</button>

  `;

    btn.onclick = () => executePokeMove(m);

}

function floatDmg(targetEl, amount){
  if(!targetEl) return;
  const parent = targetEl.parentElement;
  if(!parent) return;
  parent.style.position = 'relative';
  const f = document.createElement('div');
  f.className = 'dmg-float';
  f.textContent = '−' + amount;
  f.style.left = '40%';
  f.style.top = '20%';
  parent.appendChild(f);
  setTimeout(() => f.remove(), 900);
}

function executePokeMove(move){
  if(!battleState || battleState.turn !== 'player') return;
  const { unit, enemy } = battleState;
  const log = document.getElementById('pokeLog');
  const playerSprite = document.getElementById('pokePlayerSprite');
  const enemySprite = document.getElementById('pokeEnemySprite');
  const movesEl = document.getElementById('pokeMoves');
  if(movesEl) movesEl.style.pointerEvents = 'none';
  document.querySelectorAll('.poke-actions .btn').forEach(b => b.disabled = true);

  battleState.turn = 'animating';

  // Support / non-damage moves
  if(move.heal || move.sanHeal || (move.dmg === 0 && move.fortify)){
    log.textContent = unit.name + ' used ' + move.name + '!';
    if(move.heal){
      unit.hp = Math.min(unit.maxHp, unit.hp + move.heal);
      const hpEl = document.getElementById('pokePlayerHp');
      if(hpEl) hpEl.style.width = (unit.hp/unit.maxHp*100)+'%';
      log.textContent = unit.name + ' recovered ' + move.heal + ' HP!';
    }
    if(move.sanHeal){
      unit.san = Math.min(unit.maxSan, (unit.san||0) + move.sanHeal);
      log.textContent = unit.name + ' regained focus (+'+move.sanHeal+' Sanity)!';
    }
    if(move.fortify){
      battleState.fortified = true;
      log.textContent = unit.name + ' fortifies! Next hit reduced.';
    }
    if(move.smoke){
      battleState.smoke = true;
      log.textContent = unit.name + ' deploys smoke! Next flee will succeed.';
    }
    unit.acted = true;
    setTimeout(() => enemyPokeTurn(), 900);
    return;
  }

  const dmg = Math.max(1, move.dmg + Math.floor(Math.random()*6) - 2);
  log.textContent = unit.name + ' used ' + move.name + '!';
  playerSprite.classList.add('attack');
  if(move.fortify) battleState.fortified = true;
  if(move.smoke) battleState.smoke = true;


  setTimeout(() => {
    playerSprite.classList.remove('attack');
    enemySprite.classList.add('hurt');
    enemy.hp = Math.max(0, enemy.hp - dmg);
    const hpEl = document.getElementById('pokeEnemyHp');
    if(hpEl) hpEl.style.width = Math.max(0, enemy.hp/enemy.maxHp*100) + '%';
    floatDmg(enemySprite, dmg);
    log.textContent = enemy.name + ' took ' + dmg + ' damage!' + (move.debuff ? ' Accuracy reduced!' : '');
    if(move.debuff) battleState.enemyDebuffed = true;

    setTimeout(() => {
      enemySprite.classList.remove('hurt');
      if(enemy.hp <= 0){
        enemySprite.classList.add('faint');
        log.textContent = enemy.name + ' was destroyed!';
        state.scrap += 12 + Math.floor(Math.random()*10);
        state.bio += 4;
        if((state.buildings||[]).some(b=>b.id==='lab' && !b.building)) state.scrap += 5;
        unit.acted = true;
        state.selectedUnit = null;
        setTimeout(() => {
          closeDetail();
          if(state.enemies.every(e => e.hp <= 0)) endCombat(true);
          else { renderBattlefield(); renderRight('squad'); updateRes(); saveGame(); }
        }, 1100);
        return;
      }
      // Enemy counter-attack
      setTimeout(() => enemyPokeTurn(), 500);
    }, 750);
  }, 400);
}

function enemyPokeTurn(){
  if(!battleState) return;
  const { unit, enemy } = battleState;
  if(enemy.hp <= 0 || unit.hp <= 0) return;

  const log = document.getElementById('pokeLog');
  const playerSprite = document.getElementById('pokePlayerSprite');
  const enemySprite = document.getElementById('pokeEnemySprite');

  // Debuff reduces damage
  let dmg = enemy.dmg + Math.floor(Math.random()*5) - 1;
  if(battleState.enemyDebuffed){
    dmg = Math.max(1, Math.floor(dmg * 0.6));
    battleState.enemyDebuffed = false;
  }
  if(battleState.fortified){
    dmg = Math.max(1, Math.floor(dmg * 0.5));
    battleState.fortified = false;
    if(log) log.textContent = 'Fortified! Damage reduced!';
  }

  const attacks = ['lunges', 'strikes', 'screeches and lashes', 'surges forward'];
  const atkName = attacks[Math.floor(Math.random()*attacks.length)];
  log.textContent = enemy.name + ' ' + atkName + '!';
  enemySprite.classList.add('enemy-attack');

  setTimeout(() => {
    enemySprite.classList.remove('enemy-attack');
    playerSprite.classList.add('hurt');
    unit.hp = Math.max(0, unit.hp - dmg);
    const sanLoss = state.leader?.bonus==='Hardened' ? Math.floor(enemy.sanDmg*0.55) : enemy.sanDmg;
    // Sanctuary reduces sanity loss
    const finalSan = (state.buildings||[]).some(b=>b.id==='sanctuary' && !b.building) ? Math.floor(sanLoss*0.7) : sanLoss;
    state.sanity = Math.max(0, state.sanity - finalSan);
    const hpEl = document.getElementById('pokePlayerHp');
    if(hpEl) hpEl.style.width = Math.max(0, unit.hp/unit.maxHp*100) + '%';
    floatDmg(playerSprite, dmg);
    log.textContent = unit.name + ' took ' + dmg + ' damage!';

    setTimeout(() => {
      playerSprite.classList.remove('hurt');
      unit.acted = true;
      state.selectedUnit = null;

      if(unit.hp <= 0){
        playerSprite.classList.add('faint');
        log.textContent = unit.name + ' has fallen!';
        setTimeout(() => {
          closeDetail();
          showDetail('UNIT DOWN', `<div style="text-align:center;padding:10px">
            <img src="${unit.img}" style="width:100px;height:100px;object-fit:contain;filter:grayscale(1);opacity:0.5;margin-bottom:10px">
            <div style="color:var(--danger);font-weight:800;font-size:1.15rem">${unit.name}</div>
            <div style="color:var(--muted);margin-top:6px">Killed in action against ${enemy.name}</div>
          </div>`, [{text:'Continue', action:()=>{
            closeDetail();
            const living = getCurrentSquad().filter(u=>u.hp>0);
            if(living.length===0) endCombat(false);
            else { renderBattlefield(); renderRight('squad'); updateRes(); saveGame(); }
          }}]);
        }, 1000);

function attemptFlee(){
  if(!battleState){ closeDetail(); return; }
  const { unit, enemy } = battleState;
  const livingEnemies = state.enemies.filter(e=>e.hp>0).length;
  const log = document.getElementById('pokeLog');

  // Higher chance of being blocked with more enemies or high threat
  if(battleState.smoke){
    battleState.smoke = false;
    if(log) log.textContent = unit.name + ' escapes under smoke cover!';
    unit.acted = true; state.selectedUnit = null;
    toast(unit.name + ' fled under smoke','ok');
    setTimeout(()=>{ closeDetail(); renderBattlefield(); renderRight('squad'); }, 700);
    return;
  }
  const blockChance = 0.25 + (livingEnemies * 0.12) + (enemy.hp > 80 ? 0.15 : 0);
  const blocked = Math.random() < blockChance;

  if(blocked){
    if(log) log.textContent = enemy.name + ' blocks the escape route! You cannot flee!';
    toast('Escape blocked by the enemy!','danger');
    battleState.canFlee = false;
    // Enemy gets a free attack for trying to run
    setTimeout(() => {
      if(log) log.textContent = 'The enemy punishes the retreat attempt...';
      setTimeout(() => enemyPokeTurn(), 600);
    }, 900);
    return;
  }

  // Successful flee
  if(log) log.textContent = unit.name + ' successfully disengages!';
  unit.acted = true;
  state.selectedUnit = null;
  toast(unit.name + ' fled the engagement','ok');
  setTimeout(() => {
    closeDetail();
    renderBattlefield();
    renderRight('squad');
  }, 800);
}

const atk=livingE[Math.floor(Math.random()*livingE.length)],tgt=livingU[Math.floor(Math.random()*livingU.length)];

function retreat(){
  if(state.retreatedThisTurn){toast('Already attempted retreat this turn','warn');return;}
  state.retreatedThisTurn=true;
  const living = state.enemies.filter(e=>e.hp>0).length;
  // Advanced block logic
  if(state.trapped){
    showDetail('ESCAPE BLOCKED', 'The Vorrh have surrounded your position. Routes are cut. You need a transport vehicle or must fight through.',
      [{text:'Call Transport', action:()=>{closeDetail();callTransport();}},
       {text:'Stand and Fight', action:closeDetail}]);
    return;
  }
  if(living >= 4){
    showDetail('OVERWHELMED', 'Too many hostiles. Your squad cannot break contact without support.',
      [{text:'Call Transport', action:()=>{closeDetail();callTransport();}},
       {text:'Continue Fighting', action:closeDetail}]);
    return;
  }
  // Random chance of being stopped even with fewer enemies
  if(living >= 2 && Math.random() < 0.35){
    showDetail('AMBUSH', 'As you attempt to withdraw, a Vorrh cuts off the path. You are forced back into the fight!',
      [{text:'Engage', action:()=>{closeDetail(); toast('Forced to stand your ground','danger');}}]);
    // Enemy free attack on a random unit
    const squad = getCurrentSquad().filter(u=>u.hp>0);
    if(squad.length){
      const tgt = squad[Math.floor(Math.random()*squad.length)];
      const dmg = 8 + Math.floor(Math.random()*8);
      tgt.hp = Math.max(0, tgt.hp - dmg);
      toast(tgt.name + ' hit during retreat attempt (−'+dmg+')','danger');
      renderBattlefield(); renderRight('squad');
    }
    return;
  }
  endCombat(false);
}

function runScan(){
  const now = Date.now();
  const cd = 120000; // 2 minutes
  if(state.lastScan && now - state.lastScan < cd){
    const left = Math.ceil((cd - (now - state.lastScan))/1000);
    toast('Scan cooling down: '+left+'s','warn');
    return;
  }
  state.lastScan = now;
  // Live scan feel
  toast('Initiating deep scan...','ok');
  const circle = document.getElementById('radarCircle');
  if(circle) circle.style.boxShadow = '0 0 20px var(--accent)';
  setTimeout(()=>{
    const n=1+Math.floor(Math.random()*4);
    state.radarContacts=Array.from({length:n},()=>({x:15+Math.random()*70,y:15+Math.random()*70}));
    updateRadarBlips();
    addTx('Radar',`Deep scan complete. ${n} signatures.`,'warn');
    toast(`Scan complete: ${n} contacts`,'warn');
    if(circle) circle.style.boxShadow = '';
    if(Math.random()<.3){
      const msgs=[{from:'Outpost 7',msg:'They are inside— *screaming* ████',type:'danger'},{from:'Scout',msg:'Movement in the fog. Multiple. Large.',type:'warn'},{from:'Unknown',msg:'...the song is beautiful... do not listen...',type:'danger'}];
      const m=msgs[Math.floor(Math.random()*msgs.length)];
      addTx(m.from,m.msg,m.type);
    }
    saveGame();
    updateScanButton();
  }, 1800);
}
function updateScanButton(){
  const btn = document.querySelector('button[onclick="runScan()"]');

    const left = Math.ceil((cd - (now - state.lastScan))/1000);
    btn.textContent = 'SCAN READY IN '+left+'s';

  for(const [k,v] of Object.entries(b.cost)) state[k]-=v;
  const started = Date.now();
  state.buildings.push({id:b.id, building:true, startedAt: started, readyAt: started + b.time*1000, totalTime: b.time*1000});

}

function doTravel(id){
  if(id===state.currentSector){toast('Already at this sector','warn');return;}
  const dest = state.sectors.find(s=>s.id===id);
  if(!dest) return;
  closeDetail();

  const box = document.getElementById('detailBox');
  box.classList.add('wide', 'battle-modal');
  box.innerHTML = `
    <div class="travel-scene">
      <div class="travel-stars"></div>
      <div class="travel-planet" id="travelPlanet"></div>
      <div class="travel-ship" id="travelShip">🚀</div>
      <div class="travel-status" id="travelStatus">Preparing launch sequence...</div>
      <div class="travel-bar-wrap">
        <div class="atk-bar"><div class="atk-fill" id="travelBar" style="width:0%;transition:width 0.8s linear"></div></div>
      </div>
      <div id="travelLog" style="font-size:0.78rem;color:var(--muted);position:relative;z-index:2">Fuel cells online</div>
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('active');

  const bar = document.getElementById('travelBar');
  const log = document.getElementById('travelLog');
  const status = document.getElementById('travelStatus');
  const ship = document.getElementById('travelShip');
  const planet = document.getElementById('travelPlanet');

  const stages = [
    {pct:10, status:'Launch clearance granted', log:'Thrusters priming...', delay:700},
    {pct:25, status:'Leaving atmosphere', log:'Altitude climbing — 2km', delay:900, launch:true},
    {pct:45, status:'Entering transit corridor', log:'Nav lock on '+dest.name, delay:1000, depart:true},
    {pct:65, status:'Mid-course correction', log:'Scanning for Vorrh signatures...', delay:900},
    {pct:80, status:'Approaching destination', log:'Visual on '+dest.name, delay:800, arrive:true},
    {pct:100, status:'Landing sequence', log:'Touchdown in 3... 2... 1...', delay:1000}
  ];

  let i = 0;
  function step(){
    if(i >= stages.length){
      selectSector(id);
      setTimeout(()=>{
        closeDetail();
        toast('Arrived at '+dest.name,'ok');
        addTx('Nav', 'Command ship on station at '+dest.name+'.','ok');
        saveGame();
      }, 400);
      return;
    }
    const s = stages[i];
    bar.style.width = s.pct + '%';
    status.textContent = s.status;
    log.textContent = s.log;
    if(s.launch) ship.classList.add('launching');
    if(s.depart) planet.classList.add('depart');
    if(s.arrive){
      planet.classList.remove('depart');
      planet.classList.add('arrive');
      ship.classList.remove('launching');
      ship.style.animation = 'shipBob 2s ease-in-out infinite';
      ship.style.opacity = '1';
      ship.style.transform = 'none';
    }
    i++;
    setTimeout(step, s.delay);
  }
  setTimeout(step, 500);
}

function showWeaponDetail(w){
  const cost = state.leader?.bonus==='Tactical' ? Math.floor(w.cost*0.8) : w.cost;
  showDetail(w.name, `
    ${w.img?`<img src="${w.img}" style="width:120px;height:80px;object-fit:contain;background:#0a0c12;border-radius:6px;margin-bottom:8px">`:''}
    <div style="font-size:.85rem;margin:6px 0"><strong>Damage:</strong> ${w.dmg} &nbsp;|&nbsp; <strong>Effect:</strong> ${w.effect}</div>
    <div style="color:var(--muted);font-size:.8rem;margin-bottom:10px">${w.desc}</div>
    <div style="color:var(--accent);font-weight:700">Cost: ${cost} Scrap</div>
  `, [
    {text:'Purchase', action:()=>{closeDetail();buyWeapon(w);}},
    {text:'Close', action:closeDetail}
  ]);
}
function showVehicleDetail(v){
  showDetail(v.name, `
    <img src="${v.img}" style="width:140px;height:90px;object-fit:contain;background:#0a0c12;border-radius:6px;margin-bottom:8px">
    <div style="font-size:.85rem;margin:6px 0"><strong>Type:</strong> ${v.type}</div>
    <div style="color:var(--muted);font-size:.8rem;margin-bottom:10px">${v.desc||'Military vehicle for field operations.'}</div>
    <div style="color:var(--accent);font-weight:700">Cost: ${v.cost} Scrap</div>
  `, [
    {text:'Purchase', action:()=>{closeDetail();buyVehicle(v);}},
    {text:'Close', action:closeDetail}
  ]);
}

function showDetail(title,body,choices){const box=document.getElementById('detailBox');box.innerHTML=`<button class="modal-close" onclick="closeDetail()" title="Close">×</button><h2>${title}</h2><div class="modal-sub">${body}</div><div id="detailChoices"></div>`;
const ch=document.getElementById('detailChoices');(choices||[]).forEach(c=>{const b=document.createElement('button');b.className='btn primary';b.style.cssText='width:100%;margin-top:5px';b.textContent=c.text;b.onclick=c.action;ch.appendChild(b);});
document.getElementById('detailOverlay').classList.add('active');}
function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('active');
  const modal = document.getElementById('detailBox');
  if(modal) modal.classList.remove('wide');
}
function toast(msg,type=''){const c=document.getElementById('toasts');const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2500);}
setInterval(()=>{if(state.phase==='outpost'&&Math.random()<.08)runScan();},55000);

// Background AI — other sectors evolve while you look away
setInterval(()=>{
  if(state.phase!=='outpost') return;
  state.sectors.forEach(s=>{
    if(!s.unlocked || s.id===state.currentSector) return;
    const squad = state.sectorSquads[s.id]||[];
    const living = squad.filter(u=>u.hp>0);
    if(living.length===0) return;
    // random events
    const r = Math.random();
    if(r < 0.08){
      // minor contact
      const dmg = 5 + Math.floor(Math.random()*10);
      const tgt = living[Math.floor(Math.random()*living.length)];
      tgt.hp = Math.max(0, tgt.hp - dmg);
      addTx(s.name, `${tgt.name} reports contact. (−${dmg} HP)`,'warn');
      if(tgt.hp<=0) addTx(s.name, `${tgt.name} is down!`,'danger');
    } else if(r < 0.12){
      // resource find
      state.scrap += 3 + Math.floor(Math.random()*6);
      addTx(s.name, 'Patrol recovered scrap.','ok');
    } else if(r < 0.15 && s.status!=='secured'){
      s.status = 'hot';
      addTx(s.name, 'Vorrh activity rising.','warn');
    }
  });
  // check for wiped squads in background
  Object.keys(state.sectorSquads).forEach(sid=>{
    if(sid===state.currentSector) return;
    const sq = state.sectorSquads[sid]||[];
    if(sq.length && sq.every(u=>u.hp<=0)){
      addTx('Command', `Squad in ${(state.sectors.find(x=>x.id===sid)||{}).name||sid} has gone silent.`,'danger');
      state.sectorSquads[sid]=[];
    }
  });
}, 28000);


// Always set up UI, then try load
init();
// If a valid save exists, loadGame will switch to game screen
setTimeout(() => { loadGame(); }, 50);



// PWA install + service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // Simple offline cache for the game shell
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
// Show install prompt helper
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});
</script>
