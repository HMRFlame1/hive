<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#00e5a0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HIVE">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/1hive_orig.png">
<title>HIVE — Command Interface</title>
<style>
:root{--bg:#07080c;--panel:#0f1118;--panel2:#161a24;--border:#2a3142;--accent:#00e5a0;--accent2:#00b4d8;--danger:#ff3b5c;--warn:#ffb020;--ok:#00e5a0;--text:#e8edf5;--muted:#8b95a8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;user-select:none}
.screen{display:none;min-height:100vh}.screen.active{display:flex;flex-direction:column}
#titleScreen{align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#0a1a18 0%,#07080c 70%);padding:28px 16px;text-align:center}
.logo-img{max-width:240px;width:100%;margin-bottom:8px;filter:drop-shadow(0 0 16px rgba(0,229,160,.35))}
.tagline{color:var(--muted);letter-spacing:3px;font-size:.78rem;margin-bottom:18px}
.leader-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;max-width:900px;width:100%;margin-bottom:18px}
.leader-card{background:var(--panel);border:2px solid var(--border);border-radius:11px;padding:9px;cursor:pointer;transition:all .25s}
.leader-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 8px 22px rgba(0,229,160,.2)}
.leader-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,160,.35)}
.leader-card img{width:100%;height:160px;object-fit:contain;border-radius:8px;background:#0a0c12;margin-bottom:6px}
.leader-card h3{font-size:.85rem}.leader-card .rank{font-size:.65rem;color:var(--accent)}
.start-btn{background:linear-gradient(135deg,#00e5a0,#00b4d8);color:#04120e;border:none;padding:12px 36px;font-size:.95rem;font-weight:800;border-radius:9px;cursor:pointer}
.start-btn:disabled{opacity:.35;cursor:not-allowed}
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:7px 12px;display:flex;align-items:center;gap:14px}
.logo-small{height:26px}.res{display:flex;gap:8px}
.res-item{background:var(--panel2);padding:3px 8px;border-radius:5px;font-size:.75rem;font-weight:600}
.res-item span{color:var(--accent)}
.commander-info{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:.8rem}
.sanity-bar{width:85px;height:6px;background:#1a2030;border-radius:3px;overflow:hidden}
.sanity-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.main{flex:1;display:grid;grid-template-columns:240px 1fr 260px;overflow:hidden}
.panel{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel:last-child{border-right:none;border-left:1px solid var(--border)}
.panel-b{flex:1;overflow-y:auto;padding:9px}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;text-align:center;padding:7px 2px;font-size:.65rem;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.sector-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sector{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;min-height:58px;transition:all .2s}
.sector:hover{border-color:var(--accent)}.sector.locked{opacity:.4;cursor:not-allowed}
.sector.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.sector.hot{border-color:var(--danger)}
.sector-name{font-weight:700;font-size:.75rem}.sector-status{font-size:.6rem;color:var(--muted);margin-top:2px}
.sector-deployed{font-size:.58rem;color:var(--accent);margin-top:2px}
.unit-card{background:var(--panel2);border:2px solid var(--border);border-radius:8px;padding:6px;margin-bottom:6px;cursor:pointer;display:flex;gap:6px;align-items:center;transition:all .2s}
.unit-card:hover{border-color:var(--accent);transform:scale(1.02)}
.unit-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,229,160,.3)}
.unit-card.acted{opacity:.5;filter:grayscale(.4)}
.unit-card img{width:56px;height:56px;object-fit:contain;border-radius:6px;background:#0a0c12}
.unit-name{font-weight:700;font-size:.75rem}.unit-role{font-size:.6rem;color:var(--muted)}
.bar{height:4px;background:#1a2030;border-radius:2px;overflow:hidden;margin-top:2px}
.bar-fill{height:100%;border-radius:2px;transition:width .35s}
.hp-fill{background:linear-gradient(90deg,#00e5a0,#34d399)}.san-fill{background:linear-gradient(90deg,#00b4d8,#67e8f9)}
.center{display:flex;flex-direction:column;background:#0a0c12;overflow:hidden}
.mission-h{padding:8px 11px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.battlefield{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:9px;overflow-y:auto}
.side-title{font-size:.65rem;text-transform:uppercase;color:var(--muted);margin-bottom:4px;letter-spacing:1px}
.combat-card{background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:7px;margin-bottom:6px;cursor:pointer;display:flex;gap:6px;align-items:center}
.combat-card:hover{border-color:var(--accent)}.combat-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,229,160,.3)}
.combat-card.enemy{border-color:#5c1a1a;background:#140c0e}.combat-card.enemy:hover{border-color:var(--danger)}
.combat-card.dead{opacity:.3;filter:grayscale(.8);pointer-events:none}.combat-card.acted{opacity:.5}
.combat-card img{width:52px;height:52px;object-fit:contain;border-radius:5px;background:#0a0c12}
.action-bar{padding:8px 11px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;background:var(--panel)}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 11px;border-radius:6px;font-weight:600;font-size:.75rem;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,#00e5a0,#00b4d8);border:none;color:#04120e}
.btn.danger{background:linear-gradient(135deg,#ff3b5c,#c0102e);border:none;color:#fff}
.radar-box{background:#0a1210;border:1px solid var(--border);border-radius:8px;padding:9px;margin-bottom:7px;text-align:center}
.radar-circle{width:110px;height:110px;margin:0 auto 5px;border-radius:50%;border:2px solid rgba(0,229,160,.3);position:relative;background:radial-gradient(circle,#0a1a14 0%,#050808 70%)}
.radar-sweep{position:absolute;top:50%;left:50%;width:50%;height:2px;background:linear-gradient(90deg,transparent,var(--accent));transform-origin:left center;animation:sweep 3s linear infinite}
@keyframes sweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.radar-blip{position:absolute;width:6px;height:6px;background:var(--danger);border-radius:50%;box-shadow:0 0 5px var(--danger)}
.veh-card{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:6px;margin-bottom:5px;display:flex;gap:6px;align-items:center;cursor:pointer}
.veh-card:hover{border-color:var(--accent)}.veh-card img{width:64px;height:44px;object-fit:contain}.veh-card.deployed{border-color:var(--ok)}
.tx-item{background:var(--panel2);border-left:3px solid var(--accent2);padding:6px 8px;margin-bottom:4px;border-radius:0 5px 5px 0;font-size:.7rem}
.tx-item.danger{border-left-color:var(--danger)}.tx-item.warn{border-left-color:var(--warn)}.tx-time{font-size:.58rem;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:600;padding:12px}
.overlay.active{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:11px;max-width:500px;width:100%;padding:18px;max-height:90vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:10px;right:12px;width:32px;height:32px;border:none;background:var(--panel2);color:var(--muted);font-size:1.3rem;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;z-index:5}
.modal-close:hover{background:var(--danger);color:#fff}
.modal h2{font-size:1.1rem;margin-bottom:3px}.modal-sub{color:var(--muted);font-size:.8rem;margin-bottom:10px;line-height:1.45}
.atk-stage{text-align:center;margin:10px 0}
.atk-portraits{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:8px}
.atk-portraits img{width:76px;height:76px;object-fit:contain;border-radius:7px;background:#0a0c12;transition:all .3s}
.atk-portraits img.shake{animation:shake .4s ease}.atk-portraits img.hit{animation:hitFlash .5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes hitFlash{0%{filter:brightness(1)}30%{filter:brightness(2.2) drop-shadow(0 0 14px #ff3b5c)}100%{filter:brightness(1)}}
.atk-vs{font-size:1.4rem;font-weight:900;color:var(--danger);text-shadow:0 0 12px rgba(255,59,92,.6)}
.atk-bar{height:11px;background:#1a2030;border-radius:5px;overflow:hidden;margin:10px 0;border:1px solid var(--border)}
.atk-fill{height:100%;width:0%;background:linear-gradient(90deg,#00e5a0,#00b4d8,#ff3b5c);transition:width 0.9s linear;box-shadow:0 0 8px rgba(0,229,160,.5)}
.atk-log{font-size:.88rem;min-height:44px;color:var(--text);font-weight:600}
.atk-dmg{font-size:1.5rem;font-weight:900;color:var(--danger);text-shadow:0 0 10px rgba(255,59,92,.5);opacity:0;transition:opacity .3s}
.atk-dmg.show{opacity:1}
.store-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:6px;display:flex;gap:8px;align-items:center;cursor:pointer;transition:all .2s}
.store-item:hover{border-color:var(--accent);transform:scale(1.02)}
.store-item img{width:72px;height:52px;object-fit:contain;background:#0a0c12;border-radius:5px}
.store-info{flex:1}.store-info strong{display:block;font-size:.8rem}.store-info small{color:var(--muted);font-size:.65rem}
.store-cost{color:var(--accent);font-weight:700;font-size:.8rem}
.bio-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0;text-align:left}
.bio-item{background:var(--panel2);padding:7px;border-radius:5px;font-size:.72rem}
.bio-item .label{color:var(--muted);font-size:.6rem}
.bio-story{text-align:left;font-size:.78rem;line-height:1.5;color:var(--muted);margin:8px 0;max-height:150px;overflow-y:auto}
.toast-c{position:fixed;bottom:12px;right:12px;display:flex;flex-direction:column;gap:4px;z-index:1000;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);padding:8px 11px;border-radius:5px;font-size:.75rem;max-width:270px;animation:slideIn .3s ease}
.toast.danger{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warn)}
@keyframes slideIn{from{transform:translateX(26px);opacity:0}to{transform:translateX(0);opacity:1}}
.empty{text-align:center;color:var(--muted);padding:16px 5px;font-size:.75rem}

.build-progress { height: 8px; background: #1a2030; border-radius: 4px; overflow: hidden; margin-top: 4px; border: 1px solid var(--border); }
.build-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.5s linear; width: 0%; }
.modal.wide { max-width: 560px; }
.modal.wide img.building-hero { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
.building-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.building-stat { background: var(--panel2); padding: 10px; border-radius: 6px; font-size: 0.78rem; }
.building-stat .label { color: var(--muted); font-size: 0.65rem; margin-bottom: 2px; }


/* Pokémon-style battle */
.poke-battle { text-align: center; }
.poke-field { display: flex; justify-content: space-between; align-items: flex-end; min-height: 180px; margin: 12px 0; position: relative; }
.poke-enemy { text-align: right; flex: 1; }
.poke-player { text-align: left; flex: 1; }
.poke-sprite { width: 100px; height: 100px; object-fit: contain; background: #0a0c12; border-radius: 8px; transition: all 0.3s; }
.poke-sprite.hurt { animation: pokeHurt 0.5s ease; }
.poke-sprite.attack { animation: pokeAttack 0.4s ease; }
.poke-sprite.faint { animation: pokeFaint 0.8s ease forwards; }
@keyframes pokeHurt { 0%,100%{transform:translateX(0);filter:brightness(1)} 20%,60%{transform:translateX(-8px);filter:brightness(2) drop-shadow(0 0 8px #ff3b5c)} 40%{transform:translateX(8px)} }
@keyframes pokeAttack { 0%{transform:translateX(0)} 40%{transform:translateX(20px)} 100%{transform:translateX(0)} }
@keyframes pokeFaint { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(30px)} }
.poke-hp-box { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin: 4px 0; display: inline-block; min-width: 140px; text-align: left; }
.poke-hp-box .name { font-weight: 700; font-size: 0.8rem; }
.poke-hp-bar { height: 8px; background: #1a2030; border-radius: 4px; overflow: hidden; margin-top: 3px; }
.poke-hp-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.poke-moves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
.poke-move { background: var(--panel2); border: 2px solid var(--border); border-radius: 8px; padding: 10px; cursor: pointer; text-align: left; font-size: 0.8rem; font-weight: 600; }
.poke-move:hover { border-color: var(--accent); background: #1a2030; }
.poke-move .pp { font-size: 0.65rem; color: var(--muted); }
.poke-log { font-size: 0.85rem; min-height: 36px; margin: 8px 0; color: var(--text); font-weight: 600; }


/* ===== PHONE / MOBILE ===== */
@media (max-width: 900px) {
  .main {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }
  .panel {
    max-height: none;
    border-right: none !important;
    border-left: none !important;
    border-bottom: 1px solid var(--border);
  }
  .panel:last-child { border-bottom: none; }
  .battlefield { grid-template-columns: 1fr; gap: 8px; }
  .leader-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .leader-card img { height: 90px; }
  .topbar { flex-wrap: wrap; gap: 8px; padding: 8px 10px; }
  .commander-info { margin-left: 0; width: 100%; justify-content: space-between; }
  .action-bar { position: sticky; bottom: 0; z-index: 50; padding: 10px; gap: 8px; }
  .btn { padding: 12px 14px; font-size: 0.85rem; min-height: 44px; }
  .btn.primary, .btn.danger { flex: 1; }
  .unit-card, .combat-card, .store-item, .veh-card { min-height: 52px; }
  .modal { max-width: 100%; margin: 8px; padding: 16px; border-radius: 14px; }
  .atk-portraits img { width: 64px; height: 64px; }
  .sector-grid { grid-template-columns: 1fr 1fr; }
  .tab { padding: 12px 4px; font-size: 0.72rem; min-height: 44px; display: flex; align-items: center; justify-content: center; }
  body { padding-bottom: env(safe-area-inset-bottom); }
}

@media (max-width: 480px) {
  .leader-grid { grid-template-columns: 1fr 1fr; }
  .res-item { font-size: 0.7rem; padding: 4px 7px; }
  .logo-img { max-width: 180px; }
  .start-btn { width: 100%; max-width: 280px; padding: 14px; font-size: 1rem; }
}


/* ===== ADVANCED POKÉMON-STYLE BATTLE ===== */
.modal.battle-modal { max-width: 640px; padding: 12px 16px 16px; }
.poke-battle { text-align: center; }
.poke-field {
  display: flex; justify-content: space-between; align-items: flex-end;
  min-height: 220px; margin: 8px 0 4px; position: relative;
  background: radial-gradient(ellipse at 50% 100%, #0a1a14 0%, #07080c 70%);
  border-radius: 10px; padding: 12px 16px; border: 1px solid var(--border);
}
.poke-enemy { text-align: right; flex: 1; position: relative; }
.poke-player { text-align: left; flex: 1; position: relative; }
.poke-sprite {
  width: 120px; height: 120px; object-fit: contain;
  background: transparent; border-radius: 8px; transition: all 0.25s;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
}
.poke-sprite.hurt { animation: pokeHurt 0.55s ease; }
.poke-sprite.attack { animation: pokeAttack 0.4s ease; }
.poke-sprite.faint { animation: pokeFaint 0.9s ease forwards; }
.poke-sprite.enemy-attack { animation: pokeEnemyAttack 0.4s ease; }
@keyframes pokeHurt {
  0%,100%{transform:translateX(0);filter:brightness(1) drop-shadow(0 4px 8px rgba(0,0,0,0.5))}
  15%,50%{transform:translateX(-10px);filter:brightness(2.5) drop-shadow(0 0 12px #ff3b5c)}
  30%,70%{transform:translateX(10px)}
}
@keyframes pokeAttack {
  0%{transform:translateX(0)} 35%{transform:translateX(28px) scale(1.05)} 100%{transform:translateX(0)}
}
@keyframes pokeEnemyAttack {
  0%{transform:translateX(0)} 35%{transform:translateX(-28px) scale(1.05)} 100%{transform:translateX(0)}
}
@keyframes pokeFaint {
  0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(40px) rotate(8deg)}
}
.poke-hp-box {
  background: linear-gradient(180deg, #1a2030 0%, #0f1118 100%);
  border: 2px solid var(--border); border-radius: 8px;
  padding: 8px 12px; margin: 4px 0; display: inline-block;
  min-width: 160px; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.poke-hp-box .name { font-weight: 800; font-size: 0.88rem; letter-spacing: 0.3px; }
.poke-hp-box .lvl { font-size: 0.65rem; color: var(--muted); }
.poke-hp-bar { height: 10px; background: #0a0c12; border-radius: 5px; overflow: hidden; margin-top: 4px; border: 1px solid #1a2030; }
.poke-hp-fill { height: 100%; border-radius: 4px; transition: width 0.7s ease; }
.poke-log {
  font-size: 0.9rem; min-height: 42px; margin: 10px 0 6px;
  color: var(--text); font-weight: 600; background: var(--panel2);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
  text-align: left; line-height: 1.4;
}
.poke-moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.poke-move {
  background: linear-gradient(180deg, #1a2030 0%, #12151e 100%);
  border: 2px solid var(--border); border-radius: 10px;
  padding: 12px 14px; cursor: pointer; text-align: left;
  font-size: 0.85rem; font-weight: 700; transition: all 0.15s;
}
.poke-move:hover { border-color: var(--accent); background: #1e2535; transform: scale(1.02); }
.poke-move:active { transform: scale(0.98); }
.poke-move .pp { font-size: 0.68rem; color: var(--muted); margin-top: 2px; font-weight: 500; }
.poke-move.disabled { opacity: 0.4; pointer-events: none; }
.poke-actions { display: flex; gap: 8px; margin-top: 10px; }
.poke-actions .btn { flex: 1; padding: 10px; font-size: 0.8rem; }
.dmg-float {
  position: absolute; font-size: 1.4rem; font-weight: 900;
  color: var(--danger); text-shadow: 0 0 8px rgba(255,59,92,0.6);
  animation: dmgFloat 0.9s ease forwards; pointer-events: none; z-index: 10;
}
@keyframes dmgFloat {
  0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-40px) scale(1.2)}
}


/* ===== SHIP TRAVEL ===== */
.travel-scene {
  text-align: center; padding: 10px 0; min-height: 280px;
  background: radial-gradient(ellipse at 50% 30%, #0a1520 0%, #07080c 60%);
  border-radius: 10px; border: 1px solid var(--border); position: relative; overflow: hidden;
}
.travel-stars {
  position: absolute; inset: 0; background-image:
    radial-gradient(1px 1px at 20px 30px, #fff, transparent),
    radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 50px 160px, #fff, transparent),
    radial-gradient(1.5px 1.5px at 90px 40px, rgba(0,229,160,0.5), transparent),
    radial-gradient(1px 1px at 130px 80px, #fff, transparent),
    radial-gradient(1px 1px at 160px 120px, rgba(255,255,255,0.4), transparent);
  background-size: 200px 200px; animation: starScroll 8s linear infinite; opacity: 0.6;
}
@keyframes starScroll { from{background-position:0 0} to{background-position:0 -200px} }
.travel-ship {
  font-size: 3rem; position: relative; z-index: 2;
  animation: shipBob 2s ease-in-out infinite; margin: 20px 0 8px;
  filter: drop-shadow(0 0 12px rgba(0,180,216,0.5));
}
@keyframes shipBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.travel-ship.launching { animation: shipLaunch 2.5s ease-in forwards; }
@keyframes shipLaunch {

.travel-planet {

}
.travel-planet.depart { transform: scale(0.5); opacity: 0.3; }
.travel-planet.arrive {

}
@keyframes planetIn {

}
.travel-status { font-size: 0.9rem; font-weight: 700; margin: 8px 0; position: relative; z-index: 2; }
.travel-bar-wrap { max-width: 280px; margin: 10px auto; position: relative; z-index: 2; }


/* Death & squad wipe */
.death-scene { text-align:center; padding:16px 8px; }
.death-scene img { width:110px; height:110px; object-fit:contain; filter:grayscale(1); opacity:0.5;
  animation: deathFade 1.2s ease forwards; margin-bottom:12px; }
@keyframes deathFade {
  0%{filter:grayscale(0);opacity:1;transform:scale(1)}
  40%{filter:grayscale(0.5);opacity:0.8;transform:scale(1.05)}
  100%{filter:grayscale(1);opacity:0.4;transform:scale(0.9) translateY(10px)}

  background:radial-gradient(ellipse at 50% 40%, #1a0508 0%, #07080c 70%); border-radius:10px; }
.squad-wipe-scene .skull { font-size:3rem; animation: skullPulse 1.5s ease infinite; }
@keyframes skullPulse { 0%,100%{opacity:0.7;transform:scale(1)} 50%{opacity:1;transform:scale(1.1)} }
.cutscene-box { background:#0a0c12; border:1px solid var(--border); border-radius:10px; padding:16px; text-align:left; }
.cutscene-line { display:flex; gap:12px; margin-bottom:14px; align-items:flex-start; animation: cutIn 0.4s ease; }
@keyframes cutIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.cutscene-line .who { font-weight:800; font-size:0.8rem; color:var(--accent); }
.cutscene-line .what { font-size:0.85rem; color:var(--text); line-height:1.45; margin-top:2px; }
.mine-panel { text-align:center; padding:12px; }
.mine-bar { height:14px; background:#1a2030; border-radius:7px; overflow:hidden; margin:12px 0; border:1px solid var(--border); }
.mine-fill { height:100%; width:0%; background:linear-gradient(90deg,#ffb020,#00e5a0); transition:width 0.15s linear; }


/* Epic cutscene */
.modal.cutscene-modal { max-width: 720px; padding: 0; overflow: hidden; }
.cs-header { background:linear-gradient(90deg,#1a0508,#0a0c12); padding:14px 18px; border-bottom:1px solid #3a1520;
  font-weight:900; letter-spacing:2px; font-size:0.85rem; color:var(--danger); text-transform:uppercase; }
.cs-body { padding: 20px 18px; max-height: 60vh; overflow-y: auto;
  background: radial-gradient(ellipse at 50% 0%, #12080c 0%, #07080c 60%); }
.cs-exchange { display:flex; gap:16px; margin-bottom:22px; align-items:flex-start; animation: cutIn 0.5s ease; }
.cs-exchange.from-right { flex-direction: row-reverse; text-align: right; }
.cs-portrait { width: 90px; height: 90px; object-fit: contain; border-radius: 10px;

.cs-exchange.from-right .cs-portrait { border-color: #5c1a1a; }
.cs-bubble { flex:1; background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; position: relative; }
.cs-bubble .cs-name { font-weight: 800; font-size: 0.8rem; color: var(--accent); margin-bottom: 4px; }

.cs-bubble .cs-text { font-size: 0.92rem; line-height: 1.55; color: var(--text); }
.cs-footer { padding: 12px 18px; border-top: 1px solid var(--border); background: #0a0c12; }


/* Movie-style intro cinematic */
.modal.cine-modal { max-width: 860px; padding: 0; overflow: hidden; background: #050608; }
.cine-frame { display: flex; min-height: 420px; max-height: 75vh; }
.cine-left {
  width: 280px; flex-shrink: 0; background: linear-gradient(180deg, #0a1018 0%, #050608 100%);
  border-right: 1px solid #1a2030; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px 16px; position: relative;
}
.cine-left img {
  width: 180px; height: 180px; object-fit: contain; border-radius: 12px;
  background: #0a0c12; border: 2px solid #2a3142;

}
.cine-left .cine-name { font-weight: 900; font-size: 1rem; color: var(--accent); letter-spacing: 1px; }
.cine-left .cine-rank { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
.cine-right {
  flex: 1; padding: 28px 28px 20px; overflow-y: auto; text-align: left;
  background: radial-gradient(ellipse at 0% 0%, #0c1210 0%, #050608 55%);
}
.cine-title {
  font-size: 0.75rem; font-weight: 900; letter-spacing: 3px; color: var(--danger);

}
.cine-line {
  font-size: 1.05rem; line-height: 1.65; color: #d0d8e4; margin-bottom: 16px;

}
.cine-line.dim { color: #6b7585; }
@keyframes cineFade { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.cine-footer {
  padding: 14px 20px; border-top: 1px solid #1a2030; background: #080a0e;

/* Attack VFX */
.fx-flash {
  position: absolute; inset: 0; pointer-events: none; z-index: 20;
  background: radial-gradient(circle at 30% 50%, rgba(0,229,160,0.45) 0%, transparent 55%);
  animation: fxFlash 0.35s ease-out forwards;
}
.fx-flash.enemy {
  background: radial-gradient(circle at 70% 50%, rgba(255,59,92,0.5) 0%, transparent 55%);
}
@keyframes fxFlash {
  0%{opacity:1} 100%{opacity:0}
}
.fx-shake {
  animation: fxShake 0.4s ease-in-out !important;
}
@keyframes fxShake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}
.fx-impact {
  position: absolute; width: 60px; height: 60px; border-radius: 50%;
  border: 3px solid #ff3b5c; pointer-events: none; z-index: 15;
  animation: fxImpact 0.5s ease-out forwards;
  box-shadow: 0 0 20px #ff3b5c, inset 0 0 15px rgba(255,59,92,0.4);
}
@keyframes fxImpact {
  0%{transform:scale(0.3);opacity:1}
  100%{transform:scale(2.2);opacity:0}
}
.fx-muzzle {
  position: absolute; width: 40px; height: 40px; border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #00e5a0 40%, transparent 70%);
  pointer-events: none; z-index: 15;
  animation: fxMuzzle 0.3s ease-out forwards;
  box-shadow: 0 0 25px #00e5a0;
}
@keyframes fxMuzzle {
  0%{transform:scale(0.5);opacity:1}
  100%{transform:scale(1.8);opacity:0}
}
.fx-slash {
  position: absolute; width: 80px; height: 4px;
  background: linear-gradient(90deg, transparent, #fff, #ff3b5c, transparent);
  pointer-events: none; z-index: 15;
  animation: fxSlash 0.35s ease-out forwards;
  box-shadow: 0 0 10px #ff3b5c;
}
@keyframes fxSlash {
  0%{transform:scaleX(0.2) rotate(-20deg);opacity:1}
  100%{transform:scaleX(1.5) rotate(-20deg);opacity:0}
}
.poke-field { position: relative; overflow: hidden; }
.poke-sprite.recoil { animation: pokeRecoil 0.35s ease !important; }
@keyframes pokeRecoil {
  0%{transform:translateX(0)}
  30%{transform:translateX(18px) scale(1.05)}
  100%{transform:translateX(0)}
}
.poke-sprite.enemy-recoil { animation: pokeEnemyRecoil 0.35s ease !important; }
@keyframes pokeEnemyRecoil {
  0%{transform:translateX(0)}
  30%{transform:translateX(-18px) scale(1.05)}
  100%{transform:translateX(0)}
}

.veh-on-field {

}

</style>

function playCutscene(storyId, onDone){
  const scene = STORY[storyId];
  if(!scene){ if(onDone) onDone(); return; }
  if(!state.storySeen) state.storySeen = {};
  if(state.storySeen[storyId]){ if(onDone) onDone(); return; }
  state.storySeen[storyId] = true;

  // Movie-style intro: one speaker, portrait left, scrolling text right
  if(storyId === 'intro'){
    playCinematicIntro(scene, onDone);
    return;
  }

  const leaderImg = state.leader ? state.leader.img : PORTRAITS.sarge;
  const leaderName = state.leader ? (state.leader.rank + ' ' + state.leader.name + ' ' + (state.leader.last||'')) : 'Commander';
  const nameMap = {
    sarge:'Sgt. Harlan', susan:'Lt. Susan Voss', mike:'Cpt. Mike Draven',
    gritt:'Sgt. Gritt Kane', duke:'Cpl. Duke Reyes', vanessa:'Lt. Vanessa Cross',
    savannah:'Spc. Savannah Holt'
  };

  let lineIdx = 0;
  function showLine(){
    if(lineIdx >= scene.lines.length){
      closeDetail(); saveGame(); if(onDone) onDone(); return;
    }
    let body = '<div class="cs-body">';
    for(let i=0; i<=lineIdx; i++){
      const L = scene.lines[i];
      const isLeader = L.who === 'leader';
      const img = isLeader ? leaderImg : (PORTRAITS[L.who] || PORTRAITS.sarge);
      const who = isLeader ? leaderName : (nameMap[L.who] || L.who);
      const side = (i % 2 === 0) ? '' : ' from-right';
      body += '<div class="cs-exchange'+side+'"><img class="cs-portrait" src="'+img+'" alt=""><div class="cs-bubble"><div class="cs-name">'+who+'</div><div class="cs-text">'+L.text+'</div></div></div>';
    }
    body += '</div>';
    const isLast = lineIdx >= scene.lines.length - 1;
    const box = document.getElementById('detailBox');
    box.classList.add('wide', 'cutscene-modal');
    box.innerHTML = '<div class="cs-header">'+scene.title+'</div>'+body+'<div class="cs-footer"><button class="btn primary" style="width:100%" id="csNext">'+(isLast?'CONTINUE':'NEXT →')+'</button></div>';
    document.getElementById('csNext').onclick = ()=>{ lineIdx++; showLine(); };
    document.getElementById('detailOverlay').classList.add('active');
  }
  showLine();
}

function playCinematicIntro(scene, onDone){
  const img = PORTRAITS.sarge;
  const lines = scene.lines.map(l => l.text);
  let idx = 0;

  const box = document.getElementById('detailBox');
  box.classList.add('wide', 'cine-modal');
  box.classList.remove('cutscene-modal', 'battle-modal');

  function render(){
    let textHtml = '';
    for(let i=0; i<=idx; i++){
      textHtml += '<div class="cine-line'+(i<idx?' dim':'')+'">'+lines[i]+'</div>';
    }
    const isLast = idx >= lines.length - 1;
    box.innerHTML = `
      <div class="cine-frame">
        <div class="cine-left">
          <img src="${img}" alt="Sgt. Harlan">
          <div class="cine-name">SGT. HARLAN</div>
          <div class="cine-rank">Residual Command · Surface Theatre</div>
        </div>
        <div class="cine-right" id="cineScroll">
          <div class="cine-title">${scene.title}</div>
          ${textHtml}
        </div>
      </div>
      <div class="cine-footer">
        <button class="btn" id="cineSkip">SKIP</button>
        <button class="btn primary" id="cineNext">${isLast ? 'ENTER COMMAND' : 'NEXT →'}</button>
      </div>
    `;
    document.getElementById('detailOverlay').classList.add('active');
    // Auto-scroll to latest line
    const sc = document.getElementById('cineScroll');
    if(sc) sc.scrollTop = sc.scrollHeight;

    document.getElementById('cineNext').onclick = ()=>{
      if(isLast){
        closeDetail();
        saveGame();
        if(onDone) onDone();
      } else {
        idx++;
        render();
      }
    };
    document.getElementById('cineSkip').onclick = ()=>{
      closeDetail();
      saveGame();
      if(onDone) onDone();
    };
  }
  render();
}

function checkStoryTriggers(){

  if(charlie && charlie.unlocked && !state.storySeen.charlie_unlock){
    setTimeout(()=>playCutscene('charlie_unlock'), 600);
  }
  // Mid game - 3+ sectors unlocked
  const unlocked = state.sectors.filter(s=>s.unlocked).length;
  if(unlocked >= 4 && !state.storySeen.mid_game){
    setTimeout(()=>playCutscene('mid_game'), 800);
  }
  // Late - foxtrot unlocked
  const fox = state.sectors.find(s=>s.id==='foxtrot');
  if(fox && fox.unlocked && !state.storySeen.late_game){
    setTimeout(()=>playCutscene('late_game'), 800);
  }
}

function saveGame(){
  try{
    const data = JSON.stringify(state);
    localStorage.setItem('hive_save', data);
    toast('Game saved','ok');
  }catch(e){toast('Save failed','warn');}
}
function loadGame(){
  try{
    const raw = localStorage.getItem('hive_save');
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data || !data.leader || !data.leader.id) return false;
    Object.assign(state, data);
    // Ensure arrays exist
    if(!state.pool) state.pool = [];
    if(!state.sectorSquads) state.sectorSquads = {};
    if(!state.weapons) state.weapons = [];
    if(!state.vehicles) state.vehicles = [];
    if(!state.buildings) state.buildings = [];
    if(!state.transmissions) state.transmissions = [];
    if(!state.sectors) state.sectors = JSON.parse(JSON.stringify(SECTORS));
    document.getElementById('titleScreen').classList.remove('active');
    document.getElementById('game').classList.add('active');
    document.getElementById('cmdName').textContent = state.leader.rank+' '+state.leader.name+' '+state.leader.last;
    renderAll();
    toast('Game loaded','ok');
    return true;
  }catch(e){
    console.error('Load failed', e);
    localStorage.removeItem('hive_save');
    return false;
  }
}

squad.forEach(u=>{const el=makeUnitCard(u);el.onclick=()=>openUnit(u.id,'sector');p.appendChild(el);});}

else{state.vehicles.forEach((v,vi)=>{

function makeUnitCard(u){const el=document.createElement('div');el.className='unit-card'+(u.acted?' acted':'')+(state.selectedUnit===u.id?' selected':'');
if(u.hp<0)u.hp=0;if(u.san<0)u.san=0;const hp=Math.max(0,(u.hp/u.maxHp)*100);const san=Math.max(0,(u.san/u.maxSan)*100);
el.innerHTML=`<img src="${u.img}"><div style="flex:1;min-width:0"><div class="unit-name">${u.name}</div><div class="unit-role">${u.rank} • ${u.role}</div><div class="bar"><div class="bar-fill hp-fill" style="width:${hp}%"></div></div><div class="bar"><div class="bar-fill san-fill" style="width:${san}%"></div></div></div>`;return el;}
function renderBattlefield(){
  const ps = document.getElementById('playerSide');
  const es = document.getElementById('enemySide');
  if(!ps || !es) return;
  ps.innerHTML = '';
  es.innerHTML = '';

  // Wrap columns if needed - structure is playerSide/enemySide inside battlefield
  const sector = state.sectors.find(s=>s.id===state.currentSector);
  const sectorName = sector ? sector.name : 'Unknown';

  if(state.phase !== 'combat'){
    // Show outpost overview for current sector
    const squad = getCurrentSquad();
    const vehs = (state.vehicles||[]).filter(v=>v.deployed && v.sector===state.currentSector);
    ps.parentElement.querySelector('.side-title') && (ps.previousElementSibling);
    // Update titles via parent structure
    const titles = document.querySelectorAll('.side-title');
    if(titles[0]) titles[0].innerHTML = 'Your Forces <span class="count">'+(squad.filter(u=>u.hp>0).length)+'</span>';
    if(titles[1]) titles[1].innerHTML = 'Sector Status <span class="count">'+(sector?sector.status:'—')+'</span>';

    if(!squad.length && !vehs.length){
      ps.innerHTML = '<div class="bf-empty">No forces in this sector<div class="hint">Deploy a squad or vehicle to begin</div></div>';
    } else {
      vehs.forEach(v=>{
        const el = document.createElement('div');
        el.className = 'veh-on-field';
        el.innerHTML = '<img src="'+v.img+'"><div><div class="v-tag">VEHICLE</div><div class="c-name">'+v.name+'</div><div class="c-meta">'+(v.type||'armor')+' · On station</div></div>';
        el.onclick = ()=>showDetail(v.name, '<img src="'+v.img+'" style="width:140px;height:90px;object-fit:contain;background:#0a0c12;border-radius:6px;margin-bottom:8px"><div style="font-size:0.85rem;color:var(--muted)">Type: '+(v.type||'unknown')+'</div><div style="margin-top:6px;font-size:0.8rem">Deployed to '+(sectorName)+'</div>', [
          {text:'Recall to Pool', action:()=>{ v.deployed=false; v.sector=null; closeDetail(); toast(v.name+' recalled','ok'); renderAll(); saveGame(); }},
          {text:'Close', action:closeDetail}
        ]);
        ps.appendChild(el);
      });
      squad.forEach(u=>{
        const el = document.createElement('div');
        el.className = 'combat-card' + (u.hp<=0?' dead':'');
        const hp = Math.max(0,(u.hp/(u.maxHp||100))*100);
        el.innerHTML = '<img src="'+u.img+'"><div class="c-info"><div class="c-name">'+u.name+'</div><div class="c-meta">'+u.rank+' · '+u.role+(u.hp<=0?' · KIA':'')+'</div><div class="bar"><div class="bar-fill hp-fill" style="width:'+hp+'%"></div></div></div>';
        el.onclick = ()=>openUnit(u.id,'sector');
        ps.appendChild(el);
      });
    }
    es.innerHTML = '<div class="bf-empty">'+(sector?sector.desc:'Select a sector')+'<div class="hint">Threat level T'+(sector?sector.threat:'—')+'</div></div>';
    return;
  }

  // Combat mode
  const titles = document.querySelectorAll('.side-title');
  const squad = getCurrentSquad();
  const living = squad.filter(u=>u.hp>0);
  const livingE = state.enemies.filter(e=>e.hp>0);
  if(titles[0]) titles[0].innerHTML = 'Your Forces <span class="count">'+living.length+'</span>';
  if(titles[1]) titles[1].innerHTML = 'Hostiles, Vorrh <span class="count">'+livingE.length+'</span>';

  // Vehicles supporting this sector in combat
  const vehs = (state.vehicles||[]).filter(v=>v.deployed && v.sector===state.currentSector);
  vehs.forEach(v=>{
    const el = document.createElement('div');
    el.className = 'veh-on-field'+(state.selectedVehicle===v.id?' selected':'')+(v.acted?' acted':'');
    el.style.borderColor = state.selectedVehicle===v.id ? 'var(--accent)' : '';
    el.innerHTML = '<img src="'+v.img+'"><div><div class="v-tag">'+(v.acted?'FIRED':'VEHICLE')+'</div><div class="c-name">'+v.name+'</div><div class="c-meta">'+(v.acted?'Already acted':'Click to attack')+'</div></div>';
    el.onclick = ()=>{
      if(v.acted){ toast(v.name+' already fired this turn','warn'); return; }
      state.selectedUnit = null;
      state.selectedVehicle = v.id;
      renderBattlefield();
      toast(v.name+' selected, click an enemy','ok');
    };
    ps.appendChild(el);
  });

  living.forEach(u=>{
    const el = document.createElement('div');
    el.className = 'combat-card'+(state.selectedUnit===u.id?' selected':'')+(u.acted?' acted':'');
    const hp = Math.max(0,(u.hp/(u.maxHp||100))*100);
    el.innerHTML = '<img src="'+u.img+'"><div class="c-info"><div class="c-name">'+u.name+'</div><div class="c-meta">'+u.rank+' · '+(u.acted?'Acted':'Ready')+'</div><div class="bar"><div class="bar-fill hp-fill" style="width:'+hp+'%"></div></div></div>';
    el.onclick = ()=>{
      if(u.acted){ toast(u.name+' already acted','warn'); return; }
      state.selectedUnit = u.id;
      renderBattlefield();
      toast(u.name+' selected, click an enemy','ok');
    };
    ps.appendChild(el);
  });
  if(!living.length && !vehs.length) ps.innerHTML = '<div class="bf-empty">No living forces</div>';

  if(!state.enemies.length) es.innerHTML = '<div class="bf-empty">Sector clear</div>';
  else state.enemies.forEach((e,i)=>{
    const el = document.createElement('div');
    el.className = 'combat-card enemy'+(e.hp<=0?' dead':'');
    const hp = Math.max(0,(e.hp/(e.maxHp||1))*100);
    el.innerHTML = '<img src="'+e.img+'"><div class="c-info"><div class="c-name">'+e.name+(e.isVehicle?' ⚙':'')+'</div><div class="c-meta">'+(e.isVehicle?'ARMOR':'INFANTRY')+' · DMG '+(e.dmg||'?')+' · HP '+e.hp+'</div><div class="bar"><div class="bar-fill" style="width:'+hp+'%;background:linear-gradient(90deg,#ff3b5c,#ff6b81)"></div></div></div>';
    el.onclick = ()=>{
      if(e.hp<=0) return;
      if(state.selectedVehicle){ performVehicleAttack(state.selectedVehicle, i); return; }
      if(!state.selectedUnit){ showEnemyDetail(e); return; }
      performAttack(state.selectedUnit, i);
    };
    es.appendChild(el);
  });
}


function selectSector(id){const s=state.sectors.find(x=>x.id===id);if(!s||!s.unlocked)return;state.currentSector=id;
document.getElementById('missionTitle').textContent=s.name;document.getElementById('missionSub').textContent=s.desc+(state.sectorSquads[id]?.length?` • ${state.sectorSquads[id].length} deployed`:'');
if(state.phase==='combat'){state.phase='outpost';state.enemies=[];document.getElementById('missionPhase').textContent='OUTPOST';document.getElementById('btnDeploy').style.display='inline-block';document.getElementById('btnEndTurn').style.display='none';document.getElementById('btnRetreat').style.display='none';document.getElementById('btnExtract').style.display='none';}
renderAll();}

function openSquadSelect(){
  const living = state.pool.filter(u => u.hp > 0);
  if(!living.length){toast('No living units','danger');return;}
  window._squadSel = new Set();

  let body = `<div style="font-size:0.8rem;color:var(--muted);margin-bottom:10px">Select up to 4 soldiers for this squad. Click to toggle.</div><div id="squadPickList">`;
  living.forEach(u => {
    body += `<div class="unit-card" id="pick_${u.id}" onclick="toggleSquadPick('${u.id}')" style="cursor:pointer">
      <img src="${u.img}" style="width:48px;height:48px;object-fit:contain;border-radius:4px;background:#0a0c12">
      <div style="flex:1"><div class="unit-name">${u.name}</div>
      <div class="unit-role">${u.rank} • ${u.role} • HP ${u.hp}/${u.maxHp}</div></div>
      <div id="chk_${u.id}" style="font-size:1.2rem;color:var(--muted)">☐</div>
    </div>`;
  });
  body += `</div>
  <div style="margin-top:10px">
    <label style="font-size:0.75rem;color:var(--muted)">Squad name:</label>
    <input id="squadNameInput" value="Alpha" style="width:100%;margin-top:4px;padding:8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.9rem">
  </div>`;

  showDetail('Assemble Squad', body, [
    {text:'DEPLOY SELECTED', action: confirmSquadDeploy},
    {text:'Cancel', action: closeDetail}
  ]);
}
function toggleSquadPick(id){
  if(!window._squadSel) window._squadSel = new Set();
  const card = document.getElementById('pick_'+id);
  const chk = document.getElementById('chk_'+id);
  if(window._squadSel.has(id)){
    window._squadSel.delete(id);
    if(card) card.style.borderColor = '';
    if(chk){ chk.textContent = '☐'; chk.style.color = 'var(--muted)'; }
  } else {
    if(window._squadSel.size >= 4){toast('Max 4 soldiers per squad','warn');return;}
    window._squadSel.add(id);
    if(card) card.style.borderColor = 'var(--accent)';
    if(chk){ chk.textContent = '☑'; chk.style.color = 'var(--accent)'; }
  }
}
function confirmSquadDeploy(){
  if(!window._squadSel || window._squadSel.size === 0){toast('Select at least one soldier','warn');return;}
  const nameInput = document.getElementById('squadNameInput');
  const names = ['Alpha','Bravo','Charlie','Delta','Echo','Foxtrot','Golf','Hotel'];
  const used = Object.values(state.namedSquads||{});
  let squadName = (nameInput && nameInput.value.trim()) || names.find(n=>!used.includes(n)) || 'Squad';
  
  const selected = [];
  state.pool = state.pool.filter(u => {
    if(window._squadSel.has(u.id) && u.hp > 0){
      u.sector = state.currentSector;
      u.acted = false;
      selected.push(u);
      return false;
    }
    return true;
  });
  state.sectorSquads[state.currentSector] = selected;
  if(!state.namedSquads) state.namedSquads = {};
  state.namedSquads[state.currentSector] = squadName;
  closeDetail();
  toast('Squad '+squadName+' deployed ('+selected.length+' units)','ok');
  saveGame();
  // Continue into combat check
  const squad = getCurrentSquad().filter(u=>u.hp>0);
  if(!squad.length){toast('No living units in this sector','danger');return;}
  if(Math.random()<0.2&&state.mission>0){
    addTx('Unknown','Command... we found— ████ *screaming*','danger', true);
    showDetail('Distress Signal','A previous transmission just cut out mid-sentence.',[
      {text:'Investigate',action:()=>{closeDetail();beginCombat();}},
      {text:'Proceed carefully',action:()=>{closeDetail();beginCombat();}}
    ]);
    return;
  }
  beginCombat();
}


function tryDeploy(){
if(!state.currentSector){toast('Select a sector first','warn');return;}
if(!state.sectorSquads[state.currentSector]||!state.sectorSquads[state.currentSector].length){
if(!state.pool.filter(u=>u.hp>0).length){toast('No living units at outpost','danger');return;}
openSquadSelect();
return;
}

const squad=getCurrentSquad().filter(u=>u.hp>0);if(!squad.length){toast('No living units in this sector','danger');return;}
if(Math.random()<0.2&&state.mission>0){addTx('Unknown','Command... we found— ████ *screaming*','danger', true);
showDetail('Distress Signal','A previous transmission just cut out mid-sentence.',[{text:'Investigate',action:()=>{closeDetail();beginCombat();}},{text:'Proceed carefully',action:()=>{closeDetail();beginCombat();}}]);return;}
beginCombat();
}
function beginCombat(){
  const sector = state.sectors.find(s=>s.id===state.currentSector);
  state.phase = 'combat';
  state.mission++;
  state.turn = 1;
  state.selectedUnit = null;
  state.selectedVehicle = null;
  state.retreatedThisTurn = false;
  state.trapped = Math.random() < 0.2 + (sector?.threat||1)*0.07;
  getCurrentSquad().forEach(u=>{ u.acted = false; });
  // Reset vehicle acted flags for this sector
  (state.vehicles||[]).forEach(v=>{
    if(v.deployed && v.sector===state.currentSector) v.acted = false;
  });

  // Varied enemy force size
  const threat = sector?.threat || 1;
  const roll = Math.random();
  let count;
  if(roll < 0.12) count = 1;                          // rare lone contact
  else if(roll < 0.28) count = 2;
  else if(roll < 0.55) count = 3 + Math.floor(Math.random()*2); // 3-4
  else if(roll < 0.8) count = 5 + Math.floor(Math.random()*3);  // 5-7
  else count = 8 + Math.floor(Math.random()*5);       // 8-12 swarm
  // Scale a bit by threat
  count = Math.max(1, Math.min(14, count + Math.floor((threat-1)/2)));

  state.enemies = [];
  for(let i=0; i<count; i++){
    const tIdx = Math.min((threat-1) + Math.floor(Math.random()*2), VORRH.length-1);
    const t = VORRH[Math.max(0, tIdx)];
    state.enemies.push({
      id: 'e'+i+'_'+Date.now(),
      name: t.name,
      img: t.img,
      hp: t.hp + Math.floor(Math.random()*15),
      maxHp: t.hp + 15,
      dmg: t.dmg,
      sanDmg: t.sanDmg,
      isVehicle: false
    });
  }

  // Chance of enemy vehicles
  const enemyVehPool = [
    {name:'Vorrh Patrol Craft', img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/al1_orig.png', hp:90, dmg:18, sanDmg:6},
    {name:'Vorrh Armor', img:'https://www.gamecircuit.co.uk/uploads/1/5/2/9/152994747/al2_orig.png', hp:140, dmg:24, sanDmg:8}
  ];
  const vehChance = 0.15 + threat * 0.08;
  if(Math.random() < vehChance){
    const ev = enemyVehPool[Math.floor(Math.random()*enemyVehPool.length)];
    state.enemies.push({
      id: 'ev_'+Date.now(),
      name: ev.name,
      img: ev.img,
      hp: ev.hp,
      maxHp: ev.hp,
      dmg: ev.dmg,
      sanDmg: ev.sanDmg,
      isVehicle: true
    });
  }
  // Heavy swarm may bring 2 vehicles
  if(count >= 8 && Math.random() < 0.35){
    const ev = enemyVehPool[0];
    state.enemies.push({
      id: 'ev2_'+Date.now(),
      name: ev.name,
      img: ev.img,
      hp: ev.hp,
      maxHp: ev.hp,
      dmg: ev.dmg,
      sanDmg: ev.sanDmg,
      isVehicle: true
    });
  }

  document.getElementById('missionPhase').textContent = 'COMBAT';
  document.getElementById('btnDeploy').style.display = 'none';
  document.getElementById('btnEndTurn').style.display = 'inline-block';
  document.getElementById('btnRetreat').style.display = 'inline-block';
  document.getElementById('btnExtract').style.display = 'inline-block';

  const vehCount = state.enemies.filter(e=>e.isVehicle).length;
  addTx('Squad', 'Contact in '+(sector?.name||'sector')+'. '+count+' hostiles'+(vehCount?' + '+vehCount+' armor':'')+'.', 'warn');
  toast('Engaging '+state.enemies.length+' contacts','danger');
  renderBattlefield();
  renderRight('squad');
}


function getMovesForUnit(unit){
  const base = unit.weapon ? unit.weapon.dmg : 12;
  const role = (unit.role || '').toLowerCase();
  const name = (unit.name || '').toLowerCase();

  // Default kit
  let moves = [
    { name: unit.weapon ? unit.weapon.name : 'Rifle Fire', dmg: base, type: 'WEAPON', desc: 'Standard attack' },
    { name: 'Burst', dmg: Math.floor(base*0.7), type: 'RAPID', desc: 'Quick volley' },
    { name: 'Aimed Shot', dmg: Math.floor(base*1.3), type: 'PRECISION', desc: 'High damage' },
    { name: 'Suppress', dmg: Math.floor(base*0.45), type: 'TACTICAL', desc: 'Debuff enemy', debuff: true }
  ];

  // Role / character specific overrides
  if(role.includes('medic') || name.includes('susan')){
    moves = [
      { name: unit.weapon ? unit.weapon.name : 'Sidearm', dmg: Math.floor(base*0.9), type: 'WEAPON', desc: 'Sidearm shot' },
      { name: 'Stim Shot', dmg: 0, type: 'SUPPORT', desc: 'Restore 20 HP to self', heal: 20 },
      { name: 'Neuro-Calm', dmg: 0, type: 'SUPPORT', desc: 'Restore sanity', sanHeal: 15 },
      { name: 'Point Blank', dmg: Math.floor(base*1.2), type: 'PRECISION', desc: 'Close-range shot' }
    ];
  } else if(role.includes('heavy') || role.includes('breacher') || name.includes('mike') || name.includes('harlan')){
    moves = [
      { name: unit.weapon ? unit.weapon.name : 'Heavy Rifle', dmg: base, type: 'WEAPON', desc: 'Primary fire' },
      { name: 'Suppressing Barrage', dmg: Math.floor(base*0.8), type: 'RAPID', desc: 'Area pressure', debuff: true },
      { name: 'Breach Charge', dmg: Math.floor(base*1.5), type: 'EXPLOSIVE', desc: 'Devastating blast' },
      { name: 'Fortify', dmg: 0, type: 'DEFENSE', desc: 'Reduce next damage taken', fortify: true }
    ];
  } else if(role.includes('scout') || role.includes('recon') || name.includes('duke')){
    moves = [
      { name: unit.weapon ? unit.weapon.name : 'Scout Rifle', dmg: base, type: 'WEAPON', desc: 'Clean shot' },
      { name: 'Weak Point', dmg: Math.floor(base*1.4), type: 'PRECISION', desc: 'Critical targeting' },
      { name: 'Smoke Disengage', dmg: 0, type: 'TACTICAL', desc: 'Guaranteed escape next flee', smoke: true },
      { name: 'Mark Target', dmg: Math.floor(base*0.5), type: 'TACTICAL', desc: 'Debuff + reveal', debuff: true }
    ];
  } else if(role.includes('warden') || name.includes('gritt') || role.includes('assault')){
    moves = [
      { name: unit.weapon ? unit.weapon.name : 'Combat Rifle', dmg: base, type: 'WEAPON', desc: 'Steady fire' },
      { name: 'Hold the Line', dmg: Math.floor(base*0.6), type: 'DEFENSE', desc: 'Attack + fortify', fortify: true },
      { name: 'Execution Shot', dmg: Math.floor(base*1.45), type: 'PRECISION', desc: 'Finishing round' },
      { name: 'Bayonet', dmg: Math.floor(base*1.1), type: 'MELEE', desc: 'Close combat' }
    ];
  } else if(role.includes('engineer') || role.includes('tech') || name.includes('savannah') || name.includes('holt')){
    moves = [
      { name: unit.weapon ? unit.weapon.name : 'Pulse Tool', dmg: Math.floor(base*0.85), type: 'WEAPON', desc: 'Energy discharge' },
      { name: 'Overcharge', dmg: Math.floor(base*1.5), type: 'TECH', desc: 'Overloaded shot' },
      { name: 'EMP Burst', dmg: Math.floor(base*0.7), type: 'TECH', desc: 'Disrupt + debuff', debuff: true },
      { name: 'Repair Protocols', dmg: 0, type: 'SUPPORT', desc: 'Self-repair 15 HP', heal: 15 }
    ];
  } else if(role.includes('tactician') || name.includes('vanessa') || name.includes('cross')){
    moves = [
      { name: unit.weapon ? unit.weapon.name : 'Carbine', dmg: base, type: 'WEAPON', desc: 'Calculated shot' },
      { name: 'Coordinated Fire', dmg: Math.floor(base*1.25), type: 'TACTICAL', desc: 'Precision doctrine' },
      { name: 'Reposition', dmg: 0, type: 'TACTICAL', desc: 'Fortify + prep', fortify: true },
      { name: 'Exploit Gap', dmg: Math.floor(base*1.35), type: 'PRECISION', desc: 'Target weakness' }
    ];
  } else if(role.includes('elite') || name.includes('mark-3') || name.includes('mark 3')){
    moves = [
      { name: 'Heavy Cannon', dmg: Math.floor(base*1.2), type: 'WEAPON', desc: 'Mark-3 primary' },
      { name: 'Shatter Round', dmg: Math.floor(base*1.6), type: 'EXPLOSIVE', desc: 'Armor-piercing' },
      { name: 'Shield Wall', dmg: 0, type: 'DEFENSE', desc: 'Heavy fortify', fortify: true },
      { name: 'Sweep Fire', dmg: Math.floor(base*0.9), type: 'RAPID', desc: 'Sustained fire', debuff: true }
    ];
  }

  // Upgrades from unit.upgrades if present
  if(unit.upgrades && unit.upgrades.length){
    unit.upgrades.forEach(up => {
      if(up === 'overcharge') moves[0].dmg = Math.floor(moves[0].dmg * 1.15);
      if(up === 'veteran') moves.forEach(m => { if(m.dmg>0) m.dmg = Math.floor(m.dmg*1.1); });
    });
  }
  return moves;
}


let battleState = null;


function showEnemyDetail(e){

  showDetail(e.name, `
    <div style="text-align:center">
      <img src="${e.img}" style="width:130px;height:130px;object-fit:contain;background:#0a0c12;border-radius:8px;margin-bottom:10px">
      <div style="color:var(--danger);font-weight:800;font-size:1rem;margin-bottom:6px">VORRH HOSTILE</div>
    </div>

      <div class="building-stat"><div class="label">HP</div>${e.hp} / ${e.maxHp||e.hp}</div>
      <div class="building-stat"><div class="label">DAMAGE</div>${e.dmg||'?'}</div>
      <div class="building-stat"><div class="label">SANITY DMG</div>${e.sanDmg||'?'}</div>
      <div class="building-stat"><div class="label">STATUS</div>${e.hp<=0?'DESTROYED':pct>60?'AGGRESSIVE':pct>30?'WOUNDED':'CRITICAL'}</div>
    </div>
    <div style="font-size:0.8rem;color:var(--muted);margin-top:8px;line-height:1.45">
      ${e.name.includes('Drone')?'Scouting organism. Weak alone but swarms quickly.':
        e.name.includes('Stalker')?'Ambush predator. High sanity pressure. Prefer to strike from fog.':
        e.name.includes('Warrior')?'Front-line combat form. Armoured carapace.':
        e.name.includes('Husk')?'Infected human shell. Unpredictable and resilient.':
        e.name.includes('Elite')?'Command-caste Vorrh. Extremely dangerous.':
        'Hostile Vorrh organism.'}
    </div>
    <div style="font-size:0.72rem;color:var(--accent);margin-top:10px">Select one of your units first, then click this enemy to attack.</div>
  `, [{text:'Close', action:closeDetail}]);
}


function spawnFx(type, anchorEl){
  const field = document.querySelector('.poke-field');
  if(!field || !anchorEl) return;
  const fieldRect = field.getBoundingClientRect();
  const r = anchorEl.getBoundingClientRect();
  const x = r.left - fieldRect.left + r.width/2;
  const y = r.top - fieldRect.top + r.height/2;

  if(type === 'muzzle'){
    const el = document.createElement('div');
    el.className = 'fx-muzzle';
    el.style.left = (x - 20) + 'px';
    el.style.top = (y - 20) + 'px';
    field.appendChild(el);
    setTimeout(()=>el.remove(), 350);
  }
  if(type === 'impact'){
    const el = document.createElement('div');
    el.className = 'fx-impact';
    el.style.left = (x - 30) + 'px';
    el.style.top = (y - 30) + 'px';
    field.appendChild(el);
    setTimeout(()=>el.remove(), 550);
  }
  if(type === 'slash'){
    const el = document.createElement('div');
    el.className = 'fx-slash';
    el.style.left = (x - 40) + 'px';
    el.style.top = (y) + 'px';
    field.appendChild(el);
    setTimeout(()=>el.remove(), 400);
  }
  if(type === 'flash-player'){
    const el = document.createElement('div');
    el.className = 'fx-flash';
    field.appendChild(el);
    setTimeout(()=>el.remove(), 400);
  }
  if(type === 'flash-enemy'){
    const el = document.createElement('div');
    el.className = 'fx-flash enemy';
    field.appendChild(el);
    setTimeout(()=>el.remove(), 400);
  }
  if(type === 'shake'){
    field.classList.add('fx-shake');
    setTimeout(()=>field.classList.remove('fx-shake'), 450);
  }
}

      { name:'Target Paint', dmg:6, type:'TACTICAL', desc:'Mark for bonus damage', debuff:true },

function executeVehicleMove(move){
  if(!battleState || !battleState.vehicle) return;
  const v = battleState.vehicle;
  const enemy = battleState.enemy;
  const log = document.getElementById('pokeLog');
  const playerSprite = document.getElementById('pokePlayerSprite');
  const enemySprite = document.getElementById('pokeEnemySprite');
  document.getElementById('pokeMoves').style.pointerEvents = 'none';

  if(move.dmg === 0){
    if(log) log.textContent = v.name + ' uses ' + move.name + '!';
    if(move.fortify) battleState.fortified = true;
    v.acted = true;
    state.selectedVehicle = null;
    setTimeout(()=>{ closeDetail(); renderBattlefield(); toast(v.name+' held position','ok'); }, 800);
    return;
  }

  const dmg = Math.max(1, move.dmg + Math.floor(Math.random()*6) - 2);
  // Bonus vs enemy vehicles with heavy weapons
  const finalDmg = (enemy.isVehicle && move.type==='HEAVY') ? Math.floor(dmg*1.2) : dmg;
  if(log) log.textContent = v.name + ' fires ' + move.name + '!';
  if(playerSprite) playerSprite.classList.add('attack','recoil');
  if(typeof spawnFx==='function'){ spawnFx('muzzle', playerSprite); spawnFx('flash-player', playerSprite); }
  if(typeof sfxAttack==='function') sfxAttack();

  setTimeout(()=>{
    if(playerSprite) playerSprite.classList.remove('attack','recoil');
    if(enemySprite) enemySprite.classList.add('hurt');
    if(typeof spawnFx==='function'){ spawnFx('impact', enemySprite); spawnFx('shake', enemySprite); }
    if(typeof sfxHit==='function') sfxHit();
    enemy.hp = Math.max(0, enemy.hp - finalDmg);
    const hpEl = document.getElementById('pokeEnemyHp');
    if(hpEl) hpEl.style.width = Math.max(0, enemy.hp/enemy.maxHp*100)+'%';
    if(typeof floatDmg==='function') floatDmg(enemySprite, finalDmg);
    if(log) log.textContent = enemy.name + ' took ' + finalDmg + ' damage!';

    setTimeout(()=>{
      if(enemySprite) enemySprite.classList.remove('hurt');
      v.acted = true;
      state.selectedVehicle = null;
      if(enemy.hp <= 0){
        if(enemySprite) enemySprite.classList.add('faint');
        if(log) log.textContent = enemy.name + ' destroyed!';
        state.scrap += enemy.isVehicle ? 20 : 10;
        state.bio += 3;
      }
      battleState = null;
      setTimeout(()=>{
        closeDetail();
        if(state.enemies.every(e=>e.hp<=0)) endCombat(true);
        else { renderBattlefield(); renderRight('squad'); updateRes(); saveGame(); }
      }, 900);
    }, 700);
  }, 400);
}


function performAttack(unitId, enemyIdx){
  const squad = getCurrentSquad();
  const unit = squad.find(u => u.id === unitId);
  const enemy = state.enemies[enemyIdx];
  if(!unit || !enemy || unit.hp <= 0 || enemy.hp <= 0){ toast('Unit is down or invalid','warn'); return; }
  if(unit.acted){ toast(unit.name + ' already acted','warn'); return; }
  // Normalize HP to numbers before battle
  unit.hp = Number(unit.hp); unit.maxHp = Number(unit.maxHp) || 100;
  enemy.hp = Number(enemy.hp); enemy.maxHp = Number(enemy.maxHp) || enemy.hp;
  if(unit.hp <= 0){ toast(unit.name + ' is already down','warn'); return; }
  battleState = { unit, enemyIdx, enemy, turn: 'player', canFlee: true, gen: Date.now() };
  openPokeBattle(unit, enemy);
}

function floatDmg(targetEl, amount){
  if(!targetEl) return;
  const parent = targetEl.parentElement;
  if(!parent) return;
  parent.style.position = 'relative';
  const f = document.createElement('div');
  f.className = 'dmg-float';
  f.textContent = '−' + amount;
  f.style.left = '40%';
  f.style.top = '20%';
  parent.appendChild(f);
  setTimeout(() => f.remove(), 900);
}

function executePokeMove(move){
  if(!battleState || battleState.turn !== 'player') return;
  const { unit, enemy } = battleState;
  const log = document.getElementById('pokeLog');
  const playerSprite = document.getElementById('pokePlayerSprite');
  const enemySprite = document.getElementById('pokeEnemySprite');
  const movesEl = document.getElementById('pokeMoves');
  if(movesEl) movesEl.style.pointerEvents = 'none';
  document.querySelectorAll('.poke-actions .btn').forEach(b => b.disabled = true);

  battleState.turn = 'animating';

  // Support / non-damage moves
  if(move.heal || move.sanHeal || (move.dmg === 0 && move.fortify)){
    log.textContent = unit.name + ' used ' + move.name + '!';
    if(move.heal){
      unit.hp = Math.min(unit.maxHp, unit.hp + move.heal);
      const hpEl = document.getElementById('pokePlayerHp');
      if(hpEl) hpEl.style.width = (unit.hp/unit.maxHp*100)+'%';
      log.textContent = unit.name + ' recovered ' + move.heal + ' HP!';
    }
    if(move.sanHeal){
      unit.san = Math.min(unit.maxSan, (unit.san||0) + move.sanHeal);
      log.textContent = unit.name + ' regained focus (+'+move.sanHeal+' Sanity)!';
    }
    if(move.fortify){
      battleState.fortified = true;
      log.textContent = unit.name + ' fortifies! Next hit reduced.';
    }
    if(move.smoke){
      battleState.smoke = true;
      log.textContent = unit.name + ' deploys smoke! Next flee will succeed.';
    }
    unit.acted = true;
    setTimeout(() => enemyPokeTurn(), 900);
    return;
  }

  const dmg = Math.max(1, move.dmg + Math.floor(Math.random()*6) - 2);
  log.textContent = unit.name + ' used ' + move.name + '!';
  playerSprite.classList.add('attack', 'recoil');
  spawnFx('muzzle', playerSprite);
  spawnFx('flash-player', playerSprite);
  if(typeof sfxAttack==='function') sfxAttack();
  if(move.fortify) battleState.fortified = true;
  if(move.smoke) battleState.smoke = true;


  setTimeout(() => {
    playerSprite.classList.remove('attack', 'recoil');
    enemySprite.classList.add('hurt');
    spawnFx('impact', enemySprite);
    spawnFx('slash', enemySprite);
    spawnFx('shake', enemySprite);
    if(typeof sfxHit==='function') sfxHit();
    enemy.hp = Math.max(0, enemy.hp - dmg);
    const hpEl = document.getElementById('pokeEnemyHp');
    if(hpEl) hpEl.style.width = Math.max(0, enemy.hp/enemy.maxHp*100) + '%';
    floatDmg(enemySprite, dmg);
    log.textContent = enemy.name + ' took ' + dmg + ' damage!' + (move.debuff ? ' Accuracy reduced!' : '');
    if(move.debuff) battleState.enemyDebuffed = true;

    setTimeout(() => {
      enemySprite.classList.remove('hurt');
      if(enemy.hp <= 0){
        enemy.hp = 0;
        enemySprite.classList.add('faint');
        log.textContent = enemy.name + ' was destroyed!';
        state.scrap += 12 + Math.floor(Math.random()*10);
        state.bio += 4;
        if((state.buildings||[]).some(b=>b.id==='lab' && !b.building)) state.scrap += 5;
        unit.acted = true;
        state.selectedUnit = null;
        battleState = null; // prevent any further enemy turns
        setTimeout(() => {
          closeDetail();
          if(state.enemies.every(e => e.hp <= 0)) endCombat(true);
          else { renderBattlefield(); renderRight('squad'); updateRes(); saveGame(); }
        }, 1100);
        return;
      }
      // Enemy counter-attack
      setTimeout(() => enemyPokeTurn(), 500);
    }, 750);
  }, 400);
}

function enemyPokeTurn(){
  if(!battleState) return;
  const myGen = battleState.gen;
  const unit = battleState.unit;
  const enemy = battleState.enemy;
  if(!unit || !enemy) return;
  unit.hp = Number(unit.hp) || 0;
  unit.maxHp = Number(unit.maxHp) || 100;
  enemy.hp = Number(enemy.hp) || 0;
  if(enemy.hp <= 0 || unit.hp <= 0) return;

  const log = document.getElementById('pokeLog');
  const playerSprite = document.getElementById('pokePlayerSprite');
  const enemySprite = document.getElementById('pokeEnemySprite');

  // Fixed modest damage: 6-14 typically
  let dmg = 6 + Math.floor(Math.random() * 9);
  if(enemy.dmg && enemy.dmg > 15) dmg += 2; // elites hit a bit harder
  if(battleState.enemyDebuffed){ dmg = Math.max(1, Math.floor(dmg * 0.6)); battleState.enemyDebuffed = false; }
  if(battleState.fortified){ dmg = Math.max(1, Math.floor(dmg * 0.5)); battleState.fortified = false; }

  const attacks = ['lunges', 'strikes', 'screeches and lashes', 'surges forward'];
  if(log) log.textContent = enemy.name + ' ' + attacks[Math.floor(Math.random()*attacks.length)] + '!';
  if(enemySprite) enemySprite.classList.add('enemy-attack', 'enemy-recoil');
  spawnFx('flash-enemy', enemySprite);
  spawnFx('muzzle', enemySprite);
  if(typeof sfxAttack==='function') sfxAttack();

  setTimeout(() => {
    // Stale battle guard
    if(!battleState || battleState.gen !== myGen) return;
    if(enemySprite) enemySprite.classList.remove('enemy-attack', 'enemy-recoil');
    spawnFx('impact', playerSprite);
    spawnFx('slash', playerSprite);
    spawnFx('shake', playerSprite);
    if(typeof sfxHit==='function') sfxHit();
    if(playerSprite) playerSprite.classList.add('hurt');

    const prevHp = Number(unit.hp);
    unit.hp = Math.max(0, prevHp - dmg);

    const sanLoss = state.leader && state.leader.bonus==='Hardened' ? Math.floor((enemy.sanDmg||5)*0.55) : (enemy.sanDmg||5);
    state.sanity = Math.max(0, state.sanity - sanLoss);

    const pct = unit.maxHp > 0 ? Math.min(100, Math.max(0, (unit.hp / unit.maxHp) * 100)) : 0;
    const hpEl = document.getElementById('pokePlayerHp');
    if(hpEl) hpEl.style.width = pct + '%';
    document.querySelectorAll('.poke-player .poke-hp-box div').forEach(el=>{
      if(el.textContent && /\d+\s*\/\s*\d+/.test(el.textContent)){
        el.textContent = Math.floor(unit.hp) + ' / ' + unit.maxHp + ' HP';
      }
    });
    floatDmg(playerSprite, dmg);
    if(log) log.textContent = unit.name + ' took ' + dmg + ' damage! (' + Math.floor(prevHp) + ' to ' + Math.floor(unit.hp) + ' HP)' + (unit.hp<=0 ? ' FATAL' : '');

    setTimeout(() => {
      if(!battleState || battleState.gen !== myGen) return;
      if(playerSprite) playerSprite.classList.remove('hurt');
      unit.acted = true;
      state.selectedUnit = null;

      if(unit.hp <= 0){
        unit.hp = 0;
        if(playerSprite) playerSprite.classList.add('faint');
        if(log) log.textContent = unit.name + ' has fallen!';
        const deadUnit = unit;
        const killer = enemy.name;
        battleState = null;
        setTimeout(() => {
          closeDetail();
          showDetail('UNIT DOWN', '<div class="death-scene"><img src="'+deadUnit.img+'" alt=""><div style="color:var(--danger);font-weight:900;font-size:1.2rem">KIA</div><div style="font-weight:800;font-size:1.05rem;margin-top:6px">'+deadUnit.name+'</div><div style="color:var(--muted);margin-top:6px;font-size:0.85rem">Killed in action by '+killer+'</div></div>',
            [{text:'Continue', action:()=>{
              closeDetail();
              const living = getCurrentSquad().filter(u=>u.hp>0);
              if(living.length===0) playSquadWipe(getCurrentSquad(), killer);
              else { renderBattlefield(); renderRight('squad'); updateRes(); saveGame(); }
            }}]);
        }, 900);
        return;
      }

      battleState = null;
      setTimeout(() => {
        closeDetail();
        renderBattlefield();
        renderRight('squad');
        updateRes();
        saveGame();
      }, 600);
    }, 700);
  }, 400);
}

function attemptFlee(){
  if(!battleState){ closeDetail(); return; }
  const { unit, enemy } = battleState;
  const livingEnemies = state.enemies.filter(e=>e.hp>0).length;
  const log = document.getElementById('pokeLog');

  // Higher chance of being blocked with more enemies or high threat
  if(battleState.smoke){
    battleState.smoke = false;
    if(log) log.textContent = unit.name + ' escapes under smoke cover!';
    unit.acted = true; state.selectedUnit = null;
    toast(unit.name + ' fled under smoke','ok');
    setTimeout(()=>{ closeDetail(); renderBattlefield(); renderRight('squad'); }, 700);
    return;
  }
  const blockChance = 0.25 + (livingEnemies * 0.12) + (enemy.hp > 80 ? 0.15 : 0);
  const blocked = Math.random() < blockChance;

  if(blocked){
    if(log) log.textContent = enemy.name + ' blocks the escape route! You cannot flee!';
    toast('Escape blocked by the enemy!','danger');
    battleState.canFlee = false;
    // Enemy gets a free attack for trying to run
    setTimeout(() => {
      if(log) log.textContent = 'The enemy punishes the retreat attempt...';
      setTimeout(() => enemyPokeTurn(), 600);
    }, 900);
    return;
  }

  // Successful flee
  if(log) log.textContent = unit.name + ' successfully disengages!';
  unit.acted = true;
  state.selectedUnit = null;
  toast(unit.name + ' fled the engagement','ok');
  setTimeout(() => {
    closeDetail();
    renderBattlefield();
    renderRight('squad');
  }, 800);
}

  // Legacy mass AI disabled. Combat damage is handled inside poke battle only.

function endTurn(){
  if(state.phase!=='combat') return;

  const livingE = state.enemies.filter(e=>e.hp>0);
  const livingU = getCurrentSquad().filter(u=>u.hp>0);
  const events = [];

  if(!livingE.length){
    events.push({type:'ok', text:'No hostiles remaining. Sector is quiet.'});
  } else if(!livingU.length){
    events.push({type:'danger', text:'No living units to defend. Sector lost.'});
  } else {
    // Each living enemy may act
    livingE.forEach(enemy=>{
      if(Math.random() > 0.75){
        events.push({type:'warn', text: enemy.name + ' holds position, watching.', img: enemy.img});
        return;
      }
      const targets = getCurrentSquad().filter(u=>u.hp>0);
      if(!targets.length) return;
      const tgt = targets[Math.floor(Math.random()*targets.length)];
      // Modest damage 5-12
      let dmg = 5 + Math.floor(Math.random()*8);
      if(enemy.dmg && enemy.dmg > 15) dmg += 2;
      const prev = tgt.hp;
      tgt.hp = Math.max(0, Number(tgt.hp) - dmg);
      const sanHit = Math.floor((enemy.sanDmg||4) * 0.5);
      state.sanity = Math.max(0, state.sanity - sanHit);

      if(tgt.hp <= 0){
        tgt.hp = 0;
        events.push({
          type:'danger',
          text: enemy.name + ' strikes ' + tgt.name + ' for ' + dmg + ' damage. ' + tgt.name + ' is down!',
          img: enemy.img,
          victim: tgt.img
        });
      } else {
        events.push({
          type:'warn',
          text: enemy.name + ' hits ' + tgt.name + ' for ' + dmg + ' damage. (' + prev + ' to ' + tgt.hp + ' HP)',
          img: enemy.img
        });
      }
    });
  }

  // Ambient pressure
  state.sanity = Math.max(0, state.sanity - 2);
  events.push({type:'ok', text: 'Command sanity strain. (-2)'});

  // Reset player acted flags for next turn
  getCurrentSquad().forEach(u=>u.acted=false);
  (state.vehicles||[]).forEach(v=>{ if(v.deployed && v.sector===state.currentSector) v.acted=false; });
  state.selectedVehicle=null;
  state.turn++;
  state.retreatedThisTurn=false;

  // Build modal
  let body = '<div style="text-align:left;max-height:50vh;overflow-y:auto">';
  events.forEach(ev=>{
    const color = ev.type==='danger' ? 'var(--danger)' : ev.type==='warn' ? 'var(--warn)' : 'var(--accent)';
    body += '<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;padding:8px;background:var(--panel2);border-radius:8px;border-left:3px solid '+color+'">';
    if(ev.img) body += '<img src="'+ev.img+'" style="width:40px;height:40px;object-fit:contain;border-radius:4px;background:#0a0c12;flex-shrink:0">';
    body += '<div style="font-size:0.82rem;line-height:1.4;color:var(--text)">'+ev.text+'</div>';
    if(ev.victim) body += '<img src="'+ev.victim+'" style="width:36px;height:36px;object-fit:contain;filter:grayscale(1);opacity:0.5;border-radius:4px;flex-shrink:0">';
    body += '</div>';
  });
  body += '</div>';

  const wiped = getCurrentSquad().filter(u=>u.hp>0).length === 0 && getCurrentSquad().length > 0;

  showDetail('ENEMY PHASE — TURN ' + state.turn, body, [{
    text: wiped ? 'Continue' : 'Begin Next Turn',
    action: ()=>{
      closeDetail();
      if(wiped){
        playSquadWipe(getCurrentSquad(), 'Vorrh forces');
      } else if(state.enemies.every(e=>e.hp<=0)){
        endCombat(true);
      } else {
        updateRes();
        renderBattlefield();
        renderRight('squad');
        toast('Your turn','ok');
        saveGame();
      }
    }
  }]);
}


function playSquadWipe(squad, killer){
  const names = (squad||[]).map(u=>u.name).join(', ');
  const imgs = (squad||[]).slice(0,4).map(u=>`<img src="${u.img}" style="width:48px;height:48px;object-fit:contain;filter:grayscale(1);opacity:0.45;margin:0 3px">`).join('');
  showDetail('SQUAD LOST', `
    <div class="squad-wipe-scene">
      <div class="skull">☠</div>
      <div style="color:var(--danger);font-weight:900;font-size:1.3rem;margin:10px 0;letter-spacing:2px">SQUAD WIPED</div>
      <div style="margin:12px 0">${imgs}</div>
      <div style="color:var(--muted);font-size:0.85rem;line-height:1.5;max-width:360px;margin:0 auto">
        All units have fallen. ${killer? 'Last contact: '+killer+'.' : ''}
        <br><span style="color:var(--text)">${names||'Unknown personnel'}</span>
      </div>
      <div style="margin-top:14px;font-size:0.75rem;color:var(--danger)">No survivors. Sector compromised.</div>
    </div>
  `, [{text:'Return to Command', action:()=>{
    closeDetail();

  }}]);

}

function endCombat(victory){
  state.phase='outpost';state.enemies=[];state.selectedUnit=null;state.selectedVehicle=null;
  document.getElementById('missionPhase').textContent='OUTPOST';
  document.getElementById('btnDeploy').style.display='inline-block';
  document.getElementById('btnEndTurn').style.display='none';
  document.getElementById('btnRetreat').style.display='none';
  document.getElementById('btnExtract').style.display='none';
  const squad = getCurrentSquad();
  const living = squad.filter(u=>u.hp>0);
  if(living.length===0 && squad.length>0){
    state.sectorSquads[state.currentSector]=[];
    playSquadWipe(squad, 'Vorrh forces');
    return;
  } else if(victory){
    state.scrap+=28;state.bio+=10;
    addTx('Command','Sector secured.','ok');toast('Sector secured','ok');
    const s=state.sectors.find(x=>x.id===state.currentSector);if(s)s.status='secured';
    if(Math.random()<.38)unlockNextSector();
    if(!state.storySeen) state.storySeen={};
    if(!state.storySeen.first_victory) setTimeout(()=>playCutscene('first_victory'), 500);
    else checkStoryTriggers();
  } else {
    addTx('Command','Forced extraction. Casualties sustained.','danger');
    state.sanity=Math.max(10,state.sanity-12);toast('Forced retreat','danger');
    if(!state.storySeen) state.storySeen={};
    if(!state.storySeen.first_loss) setTimeout(()=>playCutscene('first_loss'), 500);
  }
  saveGame();
  renderAll();
}
function retreat(){
  if(state.retreatedThisTurn){toast('Already attempted retreat this turn','warn');return;}
  state.retreatedThisTurn=true;
  const living = state.enemies.filter(e=>e.hp>0).length;
  // Advanced block logic
  if(state.trapped){
    showDetail('ESCAPE BLOCKED', 'The Vorrh have surrounded your position. Routes are cut. You need a transport vehicle or must fight through.',
      [{text:'Call Transport', action:()=>{closeDetail();callTransport();}},
       {text:'Stand and Fight', action:closeDetail}]);
    return;
  }
  if(living >= 4){
    showDetail('OVERWHELMED', 'Too many hostiles. Your squad cannot break contact without support.',
      [{text:'Call Transport', action:()=>{closeDetail();callTransport();}},
       {text:'Continue Fighting', action:closeDetail}]);
    return;
  }
  // Random chance of being stopped even with fewer enemies
  if(living >= 2 && Math.random() < 0.35){
    showDetail('AMBUSH', 'As you attempt to withdraw, a Vorrh cuts off the path. You are forced back into the fight!',
      [{text:'Engage', action:()=>{closeDetail(); toast('Forced to stand your ground','danger');}}]);
    // Enemy free attack on a random unit
    const squad = getCurrentSquad().filter(u=>u.hp>0);
    if(squad.length){
      const tgt = squad[Math.floor(Math.random()*squad.length)];
      const dmg = 8 + Math.floor(Math.random()*8);
      tgt.hp = Math.max(0, tgt.hp - dmg);
      toast(tgt.name + ' hit during retreat attempt (−'+dmg+')','danger');
      renderBattlefield(); renderRight('squad');
    }
    return;
  }
  endCombat(false);
}

if(!has)state.scrap-=40;toast('Transport inbound','ok');endCombat(false);}

function runScan(){
  if(typeof sfxSonar==='function') sfxSonar();
  const now = Date.now();
  const cd = 120000; // 2 minutes
  if(state.lastScan && now - state.lastScan < cd){
    const left = Math.ceil((cd - (now - state.lastScan))/1000);
    toast('Scan cooling down: '+left+'s','warn');
    return;
  }
  state.lastScan = now;
  // Live scan feel
  toast('Initiating deep scan...','ok');
  const circle = document.getElementById('radarCircle');
  if(circle) circle.style.boxShadow = '0 0 20px var(--accent)';
  setTimeout(()=>{
    const n=1+Math.floor(Math.random()*4);
    state.radarContacts=Array.from({length:n},()=>({x:15+Math.random()*70,y:15+Math.random()*70}));
    updateRadarBlips();
    addTx('Radar',`Deep scan complete. ${n} signatures.`,'warn');
    toast(`Scan complete: ${n} contacts`,'warn');
    if(circle) circle.style.boxShadow = '';
    if(Math.random()<.3){
      const msgs=[{from:'Outpost 7',msg:'They are inside— *screaming* ████',type:'danger'},{from:'Scout',msg:'Movement in the fog. Multiple. Large.',type:'warn'},{from:'Unknown',msg:'...the song is beautiful... do not listen...',type:'danger'}];
      const m=msgs[Math.floor(Math.random()*msgs.length)];
      addTx(m.from,m.msg,m.type);
    }
    saveGame();
    updateScanButton();
  }, 1800);
}
function updateScanButton(){
  const btn = document.querySelector('button[onclick="runScan()"]');
  if(!btn) return;
  const now = Date.now();
  const cd = 120000;
  if(state.lastScan && now - state.lastScan < cd){
    const left = Math.ceil((cd - (now - state.lastScan))/1000);
    btn.textContent = 'SCAN READY IN '+left+'s';
    btn.disabled = true;
  } else {
    btn.textContent = 'FORCE SCAN';
    btn.disabled = false;
  }
}
setInterval(updateScanButton, 1000);

function updateRadarBlips(){const c=document.getElementById('radarCircle');if(!c)return;c.querySelectorAll('.radar-blip').forEach(b=>b.remove());state.radarContacts.forEach(p=>{const b=document.createElement('div');b.className='radar-blip';b.style.left=p.x+'%';b.style.top=p.y+'%';c.appendChild(b);});}

      acts+=`<button class="btn" style="width:100%;margin-top:2px;font-size:.7rem" onclick="equipW('${u.id}','${w.id}','${source}')">${w.name} (DMG ${w.dmg})</button>`;

    acts+=`<button class="btn" style="width:100%;margin-top:2px;font-size:.7rem" onclick="upgradeUnit('${u.id}','${source}','veteran',30)">Veteran Training (30⚙️) — +10% all damage</button>`;
  if(!u.upgrades.includes('overcharge'))
    acts+=`<button class="btn" style="width:100%;margin-top:2px;font-size:.7rem" onclick="upgradeUnit('${u.id}','${source}','overcharge',25)">Weapon Overcharge (25⚙️) — +15% primary</button>`;

    acts+=`<div style="font-size:0.68rem;color:var(--ok);margin-top:4px">Upgrades: ${u.upgrades.join(', ')}</div>`;

    <div style="margin:6px 0">HP ${u.hp}/${u.maxHp} • Sanity ${u.san}/${u.maxSan}</div>
    <div>Weapon: ${u.weapon?u.weapon.name:'Unarmed'}</div>
    ${movesHtml}
    ${acts}
  `,[{text:'Close',action:closeDetail}]);
