function upgradeUnit(uid, source, up, cost){
  if(state.scrap < cost){toast('Need '+cost+' Scrap','warn');return;}
  const list = source==='pool'?state.pool:getCurrentSquad();
  const u = list.find(x=>x.id===uid);
  if(!u)return;
  if(!u.upgrades) u.upgrades=[];
  if(u.upgrades.includes(up)){toast('Already trained','warn');return;}
  state.scrap -= cost;
  u.upgrades.push(up);
  toast(u.name + ' gained '+up+' training','ok');
  updateRes(); saveGame();
  closeDetail();
  openUnit(uid, source);
}

function equipW(uid,wid,source){const list=source==='pool'?state.pool:getCurrentSquad();const u=list.find(x=>x.id===uid);const w=state.weapons.find(x=>x.id===wid);if(!u||!w)return;
if(u.weapon)state.weapons.push(u.weapon);u.weapon=w;state.weapons=state.weapons.filter(x=>x.id!==wid);toast(`${u.name} equipped ${w.name}`,'ok');closeDetail();renderRight('squad');}
function recallUnit(id){const squad=getCurrentSquad();const idx=squad.findIndex(u=>u.id===id);if(idx<0)return;const u=squad.splice(idx,1)[0];u.sector=null;state.pool.push(u);toast(`${u.name} recalled`,'ok');closeDetail();renderAll();}


function startBuild(b){
  if(!state.buildings) state.buildings=[];
  if(state.buildings.find(x=>x.id===b.id)) {toast('Already built or building','warn');return;}
  for(const [k,v] of Object.entries(b.cost)){
    if((state[k]||0) < v){toast('Not enough resources','warn');return;}
  }
  for(const [k,v] of Object.entries(b.cost)) state[k]-=v;
  const started = Date.now();
  state.buildings.push({id:b.id, building:true, startedAt: started, readyAt: started + b.time*1000, totalTime: b.time*1000});
  toast('Construction started: '+b.name,'ok');
  updateRes(); renderLeft('build'); saveGame();
  // Live progress refresh while building
  const progressTimer = setInterval(()=>{
    const bb = state.buildings.find(x=>x.id===b.id);
    if(!bb || !bb.building){ clearInterval(progressTimer); return; }
    // refresh build tab if visible
    const activeTab = document.querySelector('#leftPanel')?.closest('.panel')?.querySelector('.tab.active')?.dataset.tab;
    if(activeTab==='build') renderLeft('build');
  }, 500);
  setTimeout(()=>{
    clearInterval(progressTimer);
    const bb = state.buildings.find(x=>x.id===b.id);
    if(bb){ bb.building=false; delete bb.readyAt; delete bb.startedAt; toast(b.name+' construction complete!','ok'); renderLeft('build'); saveGame(); }
  }, b.time*1000);
}

function startMining(){
  const fill = document.getElementById('mineFill');
  const status = document.getElementById('mineStatus');
  if(!fill) return;
  // Disable double-start
  const btns = document.querySelectorAll('#detailChoices .btn');
  btns.forEach(b=>b.disabled=true);
  let pct = 0;
  status.textContent = 'Drilling...';
  const iv = setInterval(()=>{
    pct += 2;
    fill.style.width = pct + '%';
    if(pct >= 30) status.textContent = 'Core sample acquired...';
    if(pct >= 60) status.textContent = 'Refining ore...';
    if(pct >= 90) status.textContent = 'Hauling to surface...';
    if(pct >= 100){
      clearInterval(iv);
      const threat = (state.sectors.find(s=>s.id===state.currentSector)||{}).threat || 1;
      const scrapGain = 8 + Math.floor(Math.random()*12) + threat*2;
      const bioGain = Math.random()<0.3 ? 2+Math.floor(Math.random()*4) : 0;
      state.scrap += scrapGain;
      if(bioGain) state.bio += bioGain;
      status.textContent = 'Extracted +'+scrapGain+' Scrap'+(bioGain?' +'+bioGain+' Bio':'');
      toast('Mining complete: +'+scrapGain+' Scrap','ok');
      updateRes(); saveGame();
      // Risk of attracting enemies
      if(Math.random() < 0.15 + threat*0.05){
        setTimeout(()=>{
          addTx('Sensors','Mining vibration drew attention. Contacts inbound.','warn', true);
          toast('Mining attracted hostiles!','danger');
        }, 600);
      }
      btns.forEach(b=>{b.disabled=false;});
      // Replace buttons
      const ch = document.getElementById('detailChoices');
      if(ch){
        ch.innerHTML = '';
        const b = document.createElement('button');
        b.className = 'btn primary';
        b.style.cssText = 'width:100%;margin-top:5px';
        b.textContent = 'Close';
        b.onclick = closeDetail;
        ch.appendChild(b);
      }
    }
  }, 300); // ~30 seconds
}

function doTravel(id){
  if(id===state.currentSector){toast('Already at this sector','warn');return;}
  const dest = state.sectors.find(s=>s.id===id);
  if(!dest) return;
  closeDetail();

  const box = document.getElementById('detailBox');
  box.classList.add('wide', 'battle-modal');
  box.innerHTML = `
    <div class="travel-scene">
      <div class="travel-stars"></div>
      <div class="travel-planet" id="travelPlanet"></div>
      <div class="travel-ship" id="travelShip">🚀</div>
      <div class="travel-status" id="travelStatus">Preparing launch sequence...</div>
      <div class="travel-bar-wrap">
        <div class="atk-bar"><div class="atk-fill" id="travelBar" style="width:0%;transition:width 0.8s linear"></div></div>
      </div>
      <div id="travelLog" style="font-size:0.78rem;color:var(--muted);position:relative;z-index:2">Fuel cells online</div>
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('active');

  const bar = document.getElementById('travelBar');
  const log = document.getElementById('travelLog');
  const status = document.getElementById('travelStatus');
  const ship = document.getElementById('travelShip');
  const planet = document.getElementById('travelPlanet');

  const stages = [
    {pct:10, status:'Launch clearance granted', log:'Thrusters priming...', delay:700},
    {pct:25, status:'Leaving atmosphere', log:'Altitude climbing — 2km', delay:900, launch:true},
    {pct:45, status:'Entering transit corridor', log:'Nav lock on '+dest.name, delay:1000, depart:true},
    {pct:65, status:'Mid-course correction', log:'Scanning for Vorrh signatures...', delay:900},
    {pct:80, status:'Approaching destination', log:'Visual on '+dest.name, delay:800, arrive:true},
    {pct:100, status:'Landing sequence', log:'Touchdown in 3... 2... 1...', delay:1000}
  ];

  let i = 0;
  function step(){
    if(i >= stages.length){
      selectSector(id);
      setTimeout(()=>{
        closeDetail();
        toast('Arrived at '+dest.name,'ok');
        addTx('Nav', 'Command ship on station at '+dest.name+'.','ok');
        saveGame();
      }, 400);
      return;
    }
    const s = stages[i];
    bar.style.width = s.pct + '%';
    status.textContent = s.status;
    log.textContent = s.log;
    if(s.launch) ship.classList.add('launching');
    if(s.depart) planet.classList.add('depart');
    if(s.arrive){
      planet.classList.remove('depart');
      planet.classList.add('arrive');
      ship.classList.remove('launching');
      ship.style.animation = 'shipBob 2s ease-in-out infinite';
      ship.style.opacity = '1';
      ship.style.transform = 'none';
    }
    i++;
    setTimeout(step, s.delay);
  }
  setTimeout(step, 500);
}

// Background AI — other sectors evolve while you look away
setInterval(()=>{
  if(state.phase!=='outpost') return;
  state.sectors.forEach(s=>{
    if(!s.unlocked || s.id===state.currentSector) return;
    const squad = state.sectorSquads[s.id]||[];
    const living = squad.filter(u=>u.hp>0);
    if(living.length===0) return;
    // random events
    const r = Math.random();
    if(r < 0.08){
      // minor contact
      const dmg = 5 + Math.floor(Math.random()*10);
      const tgt = living[Math.floor(Math.random()*living.length)];
      tgt.hp = Math.max(0, tgt.hp - dmg);
      addTx(s.name, `${tgt.name} reports contact. (−${dmg} HP)`,'warn');
      if(tgt.hp<=0) addTx(s.name, `${tgt.name} is down!`,'danger');
    } else if(r < 0.12){
      // resource find
      state.scrap += 3 + Math.floor(Math.random()*6);
      addTx(s.name, 'Patrol recovered scrap.','ok');
    } else if(r < 0.15 && s.status!=='secured'){
      s.status = 'hot';
      addTx(s.name, 'Vorrh activity rising.','warn');
    }
  });
  // check for wiped squads in background
  Object.keys(state.sectorSquads).forEach(sid=>{
    if(sid===state.currentSector) return;
    const sq = state.sectorSquads[sid]||[];
    if(sq.length && sq.every(u=>u.hp<=0)){
      addTx('Command', `Squad in ${(state.sectors.find(x=>x.id===sid)||{}).name||sid} has gone silent.`,'danger');
      state.sectorSquads[sid]=[];
    }
  });
}, 28000);



// ===== ALIEN / SCI-FI UI SOUND EFFECTS =====
let _audioCtx = null;
function getAudio(){
  if(!_audioCtx){
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}
function playAlienTone(freq, dur, type, vol, slideTo, filterFreq){
  const ctx = getAudio();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = filterFreq || freq * 1.5;
  filter.Q.value = 4;
  osc.type = type || 'sawtooth';
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), ctx.currentTime + dur);
  gain.gain.setValueAtTime(vol || 0.06, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + dur + 0.03);
}
function playNoiseBurst(dur, vol, freq){
  const ctx = getAudio();
  if(!ctx) return;
  const bufferSize = Math.floor(ctx.sampleRate * dur);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 1.5);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = freq || 800;
  filter.Q.value = 2;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(vol || 0.05, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  src.start();
}
function sfxHover(){
  // Soft swoosh / whoosh
  const ctx = getAudio();
  if(!ctx) return;
  const dur = 0.12;
  const bufferSize = Math.floor(ctx.sampleRate * dur);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){
    const t = i / bufferSize;
    // filtered noise envelope shaped like a pass-by
    const env = Math.sin(Math.PI * t) * (1 - t * 0.3);
    data[i] = (Math.random()*2-1) * env * 0.9;
  }
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(400, ctx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + dur);
  filter.Q.value = 1.2;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.045, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  src.start();
}
function sfxSonar(){
  // Classic sonar ping + echo
  const ctx = getAudio();
  if(!ctx) return;
  // Main ping
  playAlienTone(880, 0.15, 'sine', 0.08, 220, 1200);
  // Echo
  setTimeout(()=>playAlienTone(660, 0.2, 'sine', 0.04, 180, 900), 180);
  setTimeout(()=>playAlienTone(440, 0.25, 'sine', 0.025, 120, 600), 380);
  // Soft noise wash
  setTimeout(()=>playNoiseBurst(0.2, 0.03, 600), 50);
}
function sfxClick(){
  // Glitchy confirm click
  playAlienTone(180, 0.05, 'square', 0.05, 90, 400);
  playNoiseBurst(0.04, 0.03, 1200);

}

  // Scanner lock / selection

}

  // Organic impact / wet hit
  playNoiseBurst(0.12, 0.09, 250);

function sfxSuccess(){
  // Hive acknowledge
  playAlienTone(300, 0.08, 'triangle', 0.04, 450, 700);
  setTimeout(()=>playAlienTone(500, 0.1, 'sine', 0.04, 750, 1000), 70);
  setTimeout(()=>playAlienTone(900, 0.12, 'sine', 0.03, 1200, 1600), 140);
}

function bindUiSounds(){
  document.addEventListener('mouseover', (e)=>{
    const t = e.target.closest('.btn, .leader-card, .unit-card, .combat-card, .sector, .store-item, .veh-card, .poke-move, .tab');
    if(t && t !== bindUiSounds._lastHover){
      bindUiSounds._lastHover = t;
      sfxHover();
    }
  }, true);
  document.addEventListener('mouseout', (e)=>{
    const t = e.target.closest('.btn, .leader-card, .unit-card, .combat-card, .sector, .store-item, .veh-card, .poke-move, .tab');
    if(t && bindUiSounds._lastHover === t) bindUiSounds._lastHover = null;
  }, true);
  document.addEventListener('click', (e)=>{
    const t = e.target.closest('.btn, .leader-card, .unit-card, .combat-card, .sector, .store-item, .veh-card, .poke-move, .tab, .modal-close');
    if(t){
      if(t.classList.contains('leader-card') || t.classList.contains('unit-card') || t.classList.contains('combat-card')) sfxSelect();
      else sfxClick();
    }
  }, true);
}
